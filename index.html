    const doublon = doublonsDe(Object.assign({ ID: '' }, ch))[0];
    if (doublon && !f.forcer) {
      f.forcer = true;
      f.$('#ncDoublon').innerHTML = '<div class="alerte-doublon">' + ico('alerte') + '<div><b>Doublon possible</b> : « ' + esc(nomClient(doublon.client)) + ' » (' + doublon.raison + ').</div>' +
        '<button class="btn mini" id="ncOuvrir">Ouvrir la fiche</button></div>';
      f.$('#ncOuvrir').onclick = () => { f.fermer(); aller('fiche', doublon.client.ID); };
      f.$('#ncOk').textContent = 'Créer quand même';
      return;
    }
    occupe(f.$('#ncOk'), appel('crmEnregistrerClient', '', ch)).then(c => { S.d.clients.push(c); f.fermer(); aller('fiche', c.ID); toast('Fiche créée'); });
  };
}

// =================================================================== Fiche client
function pageFiche() {
  const c = client(S.id);
  if (!c) return aller('clients');
  const d = S.d;
  const ins = inscriptionActive(c.ID);
  const prop = (k, type, opts) => {
    const v = c[k] ?? '';
    let champ;
    if (type === 'select') champ = '<select data-champ="' + esc(k) + '">' + opts.map(o => '<option' + (String(v) === o ? ' selected' : '') + '>' + esc(o) + '</option>').join('') + '</select>';
    else if (type === 'textarea') champ = '<textarea data-champ="' + esc(k) + '" placeholder="—">' + esc(v) + '</textarea>';
    else if (type === 'role') champ = '<input type="text" list="listeRoles" data-champ="' + esc(k) + '" value="' + esc(v) + '" placeholder="Gérant, coach…">' +
      '<datalist id="listeRoles">' + ROLES.map(r => '<option value="' + r + '">').join('') + '</datalist>';
    else champ = '<input type="' + (type || 'text') + '" data-champ="' + esc(k) + '" value="' + esc(v) + '" placeholder="—">';
    return '<label class="prop"><span>' + esc(k) + '</span>' + champ + '</label>';
  };
  // Téléphone / e-mail : le principal s'affiche, le second se déplie d'un clic (et peut devenir le principal).
  const double = (k1, k2, type, libelle) => {
    const v2 = c[k2] || '';
    return '<div class="prop prop-double"><span>' + libelle + '</span><div class="double-ligne"><input type="' + type + '" data-champ="' + esc(k1) + '" value="' + esc(c[k1] || '') + '" placeholder="—">' +
      '<button type="button" class="pastille-2' + (v2 ? ' rempli' : '') + '" data-deplier="' + esc(k2) + '" title="' + (v2 ? 'Voir le 2e' : 'Ajouter un 2e') + '">' + (v2 ? '2' : '+') + '</button></div>' +
      '<div class="double-second" data-second="' + esc(k2) + '"' + (S.deplies && S.deplies[k2] ? '' : ' hidden') + '><input type="' + type + '" data-champ="' + esc(k2) + '" value="' + esc(v2) + '" placeholder="2e ' + libelle.toLowerCase() + '">' +
      (v2 ? '<button type="button" class="btn mini fantome" data-principal="' + esc(k1) + '|' + esc(k2) + '" title="Utiliser comme principal">' + ico('etoile') + 'Principal</button>' : '') + '</div></div>';
  };
  const section = (titre, contenu, ouvert) => '<details' + (ouvert ? ' open' : '') + '><summary>' + titre + ico('bas') + '</summary><div class="contenu">' + contenu + '</div></details>';
  const perso = d.champs.filter(k => !CHAMPS_SYSTEME.includes(k));
  const faits = '<span class="puce">' + ico('tel') + 'Dernier appel : ' + esc(ilYa(c['Dernier appel'])) + '</span>' +
    (c.Devis && c.Devis !== 'Aucun' ? '<span class="puce ' + (c.Devis === 'Accepté' ? 'vert' : 'orange') + '">' + ico('note') + 'Devis ' + esc(c.Devis.toLowerCase()) + (c['Montant devis'] ? ' · ' + esc(c['Montant devis']) : '') + '</span>' : '') +
    (() => { const r = S.d.activites.filter(a => a.ClientID === c.ID && a['Résultat'] === 'Réponse reçue').sort((a, b) => String(b.Date).localeCompare(String(a.Date)))[0];
      return r ? '<span class="puce vert">' + ico('mail') + 'A répondu ' + esc(ilYa(r.Date)) + '</span>' : ''; })() +
    (dernierClic(c.ID) ? '<span class="puce orange">' + ico('clic') + 'A cliqué ' + esc(ilYa(dernierClic(c.ID))) + '</span>' : '') +
    (ins ? '<span class="puce vert">' + ico('sequence') + 'En séquence</span>' : c['Séquence'] && !['En séquence', 'Répondu'].includes(c['Séquence']) ? '<span class="puce">' + ico('sequence') + esc(c['Séquence']) + '</span>' : '');

  $('#page').innerHTML = '<div class="page">' +
    '<div class="fil"><a href="#" id="retour">' + ico('retour') + 'Clients</a><span class="pale">/</span><span>' + esc(nomClient(c)) + '</span></div>' +
    bandeauTache(c) +
    '<div class="segment fiche-onglets">' + [['infos', 'Infos'], ['activite', 'Activité'], ['suivi', 'Suivi']].map(([k, n]) =>
      '<button data-onglet="' + k + '" class="' + (S.ongletFiche === k ? 'actif' : '') + '">' + n + '</button>').join('') + '</div>' +
    '<div class="fiche">' +
      '<section class="col-gauche' + (S.ongletFiche === 'infos' ? ' visible' : '') + '">' +
        doublonsDe(c).map(x => '<div class="alerte-doublon">' + ico('alerte') + '<div><b>Doublon possible</b> : « ' + esc(nomClient(x.client)) + ' » (' + x.raison + ')</div>' +
          '<button class="btn mini" data-ouvrir-doublon="' + x.client.ID + '">Voir</button><button class="btn mini principal" data-fusion="' + x.client.ID + '">Fusionner</button></div>').join('') +
        '<div class="carte"><div class="profil">' + avatar(nomClient(c), 'l') +
          '<input class="titre-edit" data-champ="Salle" value="' + esc(c.Salle) + '" placeholder="Nom de la salle">' +
          '<div class="doux" style="font-size:14px;padding-left:1px">' + esc([contactClient(c), c.Ville].filter(Boolean).join(' · ') || 'Contact à compléter') + '</div>' +
          '<div class="faits">' + faits + '</div>' +
          '<div class="choix-tag">' + d.tags.map(t => '<button data-tag="' + t + '" class="' + (c.Tag === t ? 'actif tag ' + t : '') + '">' + t + '</button>').join('') + '</div>' +
          '<div class="owner-ligne">' + avatar(c.Owner || '?', 's') + '<select data-champ="Owner" aria-label="Contact owner">' +
            ['', ...d.owners].map(o => '<option value="' + esc(o) + '"' + (c.Owner === o ? ' selected' : '') + '>' + esc(o ? 'Owner : ' + o : 'Sans owner') + '</option>').join('') + '</select></div>' +
          '<div class="actions-fiche">' +
            [['aAppel', 'tel', 'Appel'], ['aMail', 'mail', 'E-mail'], ['aSeq', 'sequence', ins ? 'Séquence ✓' : 'Séquence'], ['aNote', 'note', 'Note'], ['aTache', 'tache', 'Tâche'], ['aRdv', 'rdv', 'RDV'], ['aComp', 'comparer', 'Comparer']]
              .map(([id, i, n]) => '<button class="action" id="' + id + '"><span>' + ico(i) + '</span>' + n + '</button>').join('') +
          '</div></div>' +
          '<div class="proprietes">' +
            section('Coordonnées', prop('Prénom') + prop('Nom') + prop('Rôle', 'role') + double('Email', 'Email 2', 'email', 'E-mail') + double('Téléphone', 'Téléphone 2', 'tel', 'Téléphone'), true) +
            section('La salle', prop('Ville') + prop('Adresse') + prop('Discipline') + prop('Site web') + prop('Source'), true) +
            section('Devis', prop('Devis', 'select', d.devis) + prop('Montant devis'), true) +
            section('Prospection', prop('Accroche', 'textarea') + prop('Notes', 'textarea'), false) +
            section('Champs personnalisés', perso.map(k => prop(k)).join('') + '<button class="lien-ajout" id="ajoutChamp">' + ico('plus') + 'Ajouter un champ</button>', perso.length > 0) +
          '</div>' +
          '<div style="padding:12px 20px;border-top:1px solid var(--trait)" class="rangee"><span class="pale petit">Créée le ' + esc(fmtDate(c['Créé le'])) + '</span><span class="espace"></span>' +
            '<button class="btn fantome mini danger" id="suppr">' + ico('poubelle') + 'Supprimer</button></div>' +
        '</div></section>' +
      '<section class="col-centre' + (S.ongletFiche === 'activite' ? ' visible' : '') + '">' + carteActivite(c) + '</section>' +
      '<section class="col-droite' + (S.ongletFiche === 'suivi' ? ' visible' : '') + '">' + carteComparatifs(c) + carteCommandes(c) + carteSequence(c, ins) + carteAVenir(c) + '</section>' +
    '</div></div>';

  $('#retour').onclick = e => { e.preventDefault(); aller('clients'); };
  $$('[data-onglet]').forEach(b => b.onclick = () => { S.ongletFiche = b.dataset.onglet; pageFiche(); });
  $$('[data-champ]').forEach(i => i.onchange = () => enregistrerChamp(c.ID, i.dataset.champ, i.value, i));
  $$('[data-tag]').forEach(b => b.onclick = () => {
    const tag = b.dataset.tag;
    if (tag === c.Tag) return;
    if (tag === 'Lost' && commandesDe(c.ID).length) return fenetreChurn(c);
    enregistrerChamp(c.ID, 'Tag', tag, null, true);
  });
  $$('[data-deplier]').forEach(b => b.onclick = () => {
    S.deplies = S.deplies || {};
    const k = b.dataset.deplier, z = $('[data-second="' + k + '"]');
    S.deplies[k] = z.hidden;
    z.hidden = !z.hidden;
    if (!z.hidden) z.querySelector('input').focus();
  });
  $$('[data-principal]').forEach(b => b.onclick = () => {
    const [k1, k2] = b.dataset.principal.split('|');
    enregistrerChamps(c.ID, { [k1]: c[k2], [k2]: c[k1] }, null, true);
    toast((k1 === 'Email' ? 'E-mail' : 'Numéro') + ' principal changé');
  });
  brancherCommandes(c);
  $$('[data-fusion]').forEach(b => b.onclick = () => fenetreFusion(c, client(b.dataset.fusion)));
  $$('[data-ouvrir-doublon]').forEach(b => b.onclick = () => aller('fiche', b.dataset.ouvrirDoublon));
  $$('[data-modif-act]').forEach(b => b.onclick = () => fenetreModifActivite(S.d.activites.find(a => a.ID === b.dataset.modifAct)));
  $('#aAppel').onclick = () => fenetreAppel(c);
  $('#aMail').onclick = () => fenetreEmail(c);
  $('#aSeq').onclick = () => ins ? (S.ongletFiche = 'suivi', pageFiche(), toast('Déjà en séquence : « ' + ins.Nom + ' »')) : fenetreSequence([c.ID]);
  $('#aNote').onclick = () => fenetreNote(c);
  $('#aTache').onclick = () => fenetreTache({ ClientID: c.ID });
  $('#aRdv').onclick = () => fenetreRdv(c);
  $('#aComp').onclick = () => ouvrirComparateur(c);
  brancherBandeauTache(c);
  brancherComparatifs(c);
  $('#ajoutChamp').onclick = () => demanderTexte('Nouveau champ', 'Nom du champ (visible sur toutes les fiches)', 'Ex. : Nombre d’adhérents').then(nom =>
    appel('crmAjouterChamp', nom).then(ch => { S.d.champs = ch; pageFiche(); toast('Champ « ' + nom + ' » ajouté'); }));
  $('#suppr').onclick = () => confirmer('Supprimer ' + esc(nomClient(c)) + ' ?', 'La fiche sera supprimée du CRM (sa séquence éventuelle est arrêtée). Cette action est définitive.', 'Supprimer')
    .then(ok => ok && appel('crmSupprimerClient', c.ID).then(() => { S.d.clients = S.d.clients.filter(x => x.ID !== c.ID); aller('clients'); toast('Fiche supprimée'); }));
  const arret = $('#arretSeq');
  if (arret) arret.onclick = () => confirmer('Arrêter la séquence ?', 'Plus aucun e-mail ni tâche de « ' + esc(ins.Nom) + ' » ne sera créé pour ce client.', 'Arrêter')
    .then(ok => ok && occupe(arret, appel('crmArreterSequence', c.ID)).then(data => { S.d = data; pageFiche(); toast('Séquence arrêtée'); }));
  $$('[data-filtre-act]').forEach(b => b.onclick = () => { S.filtreActivite = b.dataset.filtreAct; pageFiche(); });
  $$('.texte-act.replie').forEach(t => t.onclick = () => t.classList.remove('replie'));
  brancherTaches();
}

/** Affiché tout de suite, enregistré en arrière-plan ; en cas d'échec, la fiche revient à l'état d'avant. */
function enregistrerChamps(id, changes, element, rafraichir) {
  const c = client(id);
  const avant = Object.assign({}, c);
  Object.assign(c, changes);
  if (element) { element.classList.remove('enregistre'); void element.offsetWidth; element.classList.add('enregistre'); }
  const visible = rafraichir || Object.keys(changes).some(k => ['Owner', 'Prénom', 'Nom', 'Rôle', 'Ville', 'Devis', 'Montant devis', 'Tag', 'Téléphone', 'Téléphone 2', 'Email', 'Email 2'].includes(k));
  if (visible && S.page === 'fiche') pageFiche();
  return appel('crmEnregistrerClient', id, changes).then(x => {
    majClient(x);
    if (S.page === 'fiche' && S.id === id && (x.Tag === 'Won' && avant.Tag !== 'Won')) { pageFiche(); toast('Vente enregistrée : 1 commande ajoutée'); }
    return x;
  }).catch(() => { Object.assign(c, avant); if (S.page === 'fiche') pageFiche(); });
}
const enregistrerChamp = (id, champ, valeur, element, rafraichir) => enregistrerChamps(id, { [champ]: valeur }, element, rafraichir);

/** E-mail reçu du client ('client'), envoyé par nous ('nous'), ou autre activité (''). */
const sensEmail = a => a.Type !== 'E-mail' ? '' : a['Résultat'] === 'Réponse reçue' ? 'client' : /^(Envoyé|Séquence)/.test(a['Résultat'] || '') ? 'nous' : '';

function carteActivite(c) {
  const filtres = ['Tout', 'E-mail', 'Clic', 'Appel', 'Note', 'Commande', 'Tâche', 'RDV', 'Séquence'];
  const histo = S.d.activites.filter(a => a.ClientID === c.ID && (S.filtreActivite === 'Tout' || a.Type === S.filtreActivite))
    .sort((a, b) => String(b.Date).localeCompare(String(a.Date)));
  return '<div class="carte"><div class="carte-tete"><h2>Activité</h2></div>' +
    '<div style="padding:12px 18px 0"><div class="vues" style="padding-bottom:4px">' + filtres.map(f => '<button data-filtre-act="' + f + '" class="' + (S.filtreActivite === f ? 'actif' : '') + '">' +
      ({ Tout: 'Tout', 'E-mail': 'E-mails', Clic: 'Clics', Appel: 'Appels', Note: 'Notes', Commande: 'Commandes', 'Tâche': 'Tâches', RDV: 'Rendez-vous', 'Séquence': 'Séquences' }[f]) + '</button>').join('') + '</div></div>' +
    (histo.length ? '<ul class="chronologie">' + histo.map((a, n) => { const sens = sensEmail(a);
      return '<li class="' + (sens ? 'conv-' + sens : '') + '" style="--n:' + Math.min(n, 20) + '"><span class="bulle ' + esc(a.Type) + '">' + ico(TYPE_ICONE[a.Type] || 'note') + '</span><div>' +
      '<div class="titre-act">' + (sens === 'client' ? esc(c['Prénom'] || nomClient(c)) + ' <span>· a répondu</span>' : sens === 'nous' ? 'E-mail envoyé <span>· ' + esc(a['Résultat'] || '') + '</span>' : esc(a.Type) + (a['Résultat'] ? ' <span>· ' + esc(a['Résultat']) + '</span>' : '')) +
        (['Note', 'Appel'].includes(a.Type) ? '<button class="btn fantome icone mini-icone" data-modif-act="' + a.ID + '" aria-label="Modifier ou supprimer">' + ico('crayon') + '</button>' : '') + '</div>' +
      (a.Texte ? '<div class="texte-act' + (String(a.Texte).length > 240 ? ' replie' : '') + '">' + esc(a.Texte) + '</div>' : '') +
      '<div class="meta">' + esc(relatif(a.Date)) + (a.Auteur ? ' · ' + esc(a.Auteur) : '') + '</div></div></li>'; }).join('') + '</ul>'
      : '<div class="vide">' + ico('horloge') + '<b>Rien pour l’instant</b>Les appels, e-mails, notes et séquences apparaîtront ici.</div>') + '</div>';
}

/** Fusion de deux fiches : on choisit celle qui reste, l'autre la complète puis disparaît. */
function fenetreFusion(a, b) {
  if (!a || !b) return;
  const score = c => Object.values(c).filter(v => v !== '' && v != null).length + commandesDe(c.ID).length * 5 + S.d.activites.filter(x => x.ClientID === c.ID).length;
  let garde = score(b) > score(a) ? b.ID : a.ID;
  const lignes = ['Salle', 'Prénom', 'Nom', 'Téléphone', 'Téléphone 2', 'Email', 'Email 2', 'Ville', 'Tag', 'Owner', 'Devis'];
  const carte = c => '<label class="carte-fusion" data-garde="' + c.ID + '"><input type="radio" name="garde" value="' + c.ID + '"' + (garde === c.ID ? ' checked' : '') + '>' +
    '<b>' + esc(nomClient(c)) + '</b><span class="pale petit">Créée le ' + esc(fmtDate(c['Créé le'])) + ' · ' + S.d.activites.filter(x => x.ClientID === c.ID).length + ' activité(s) · ' + commandesDe(c.ID).length + ' commande(s)</span>' +
    '<dl>' + lignes.filter(k => c[k]).map(k => '<dt>' + esc(k) + '</dt><dd>' + esc(c[k]) + '</dd>').join('') + '</dl></label>';
  const f = fenetre({ titre: 'Fusionner deux fiches', large: true, corps:
    '<p class="doux" style="margin-top:0">Choisissez la fiche qui reste. L’autre complète ses champs vides (2e numéro / 2e e-mail si différents), ses notes s’ajoutent, et tout son historique (appels, e-mails, tâches, RDV, commandes, séquences) est rattaché. Elle est ensuite supprimée.</p>' +
    '<div class="grille-fusion">' + carte(a) + carte(b) + '</div>',
    pied: '<button class="btn" data-fermer>Annuler</button><button class="btn principal" id="fuOk">Fusionner</button>' });
  f.el.querySelectorAll('input[name=garde]').forEach(r => r.onchange = () => { garde = r.value; });
  f.$('#fuOk').onclick = () => {
    const autre = garde === a.ID ? b.ID : a.ID;
    occupe(f.$('#fuOk'), appel('crmFusionner', garde, autre, S.moi)).then(d => { S.d = d; f.fermer(); aller('fiche', garde); toast('Fiches fusionnées'); });
  };
}

function fenetreModifActivite(a) {
  if (!a) return;
  const f = fenetre({ titre: (a.Type === 'Note' ? 'Modifier la note' : 'Modifier le compte rendu'), corps:
    '<p class="pale petit" style="margin-top:0">' + esc(a.Type) + (a['Résultat'] ? ' · ' + esc(a['Résultat']) : '') + ' · ' + esc(relatif(a.Date)) + (a.Auteur ? ' · ' + esc(a.Auteur) : '') + '</p>' +
    '<textarea id="maTxt" style="min-height:150px">' + esc(a.Texte) + '</textarea>',
    pied: '<button class="btn danger gauche" id="maSuppr">' + ico('poubelle') + 'Supprimer</button><button class="btn" data-fermer>Annuler</button><button class="btn principal" id="maOk">Enregistrer</button>' });
  f.$('#maOk').onclick = () => occupe(f.$('#maOk'), appel('crmModifierActivite', a.ID, f.$('#maTxt').value.trim()))
    .then(x => { remplacer(S.d.activites, x); f.fermer(); afficher(); toast('Modifié'); });
  f.$('#maSuppr').onclick = () => confirmer('Supprimer ?', 'Cet élément sera retiré de l’historique du client.', 'Supprimer').then(ok => ok &&
    appel('crmSupprimerActivite', a.ID).then(() => { S.d.activites = S.d.activites.filter(x => x.ID !== a.ID); f.fermer(); afficher(); toast('Supprimé'); }));
}

// =================================================================== Commandes (ventes, rachats, churn)
const commandesDe = clientId => S.d.commandes.filter(x => x.ClientID === clientId).sort((a, b) => String(b.Date).localeCompare(String(a.Date)));
const euros = (n, dec) => (Number(n) || 0).toLocaleString('fr-FR', { minimumFractionDigits: dec ?? 0, maximumFractionDigits: dec ?? 0 }) + ' €';
const montantCommande = x => (Number(x.Bidons) || 0) * (Number(x['Prix bidon HT']) || 0);
const montantTTC = x => (montantCommande(x) + (Number(x['Livraison HT']) || 0)) * (1 + (Number(S.d.reglages.TVA) || 0) / 100);
const pucePaiement = x => x['Payée le'] ? '<span class="puce vert" title="' + (x.TransactionID ? 'Virement reçu sur Qonto' : 'Paiement saisi à la main') + '">' + ico('ok') + 'Payée ' + esc(fmtDate(x['Payée le'])) + '</span>'
  : '<span class="puce orange">À encaisser</span>';

function carteCommandes(c) {
  const cmds = commandesDe(c.ID);
  const rachat = c['Date rachat'] ? new Date(c['Date rachat']) : null;
  const du = rachat && rachat <= new Date(Date.now() + 7 * 864e5) && c.Tag === 'Won';
  if (!cmds.length && c.Tag !== 'Won') {
    return '<div class="carte"><div class="carte-tete"><h2>Commandes</h2><button class="btn mini" id="cmNouvelle">' + ico('panier') + 'Vente</button></div>' +
      '<div class="carte-corps doux petit">Pas encore client. Passer en <b>Won</b> enregistre automatiquement la première commande.</div></div>';
  }
  const total = cmds.reduce((t, x) => t + montantCommande(x), 0);
  return '<div class="carte"><div class="carte-tete"><h2>Commandes</h2><button class="btn mini principal" id="cmNouvelle">' + ico('plus') + 'Commande</button></div>' +
    '<div class="carte-corps">' +
      '<div class="rachat' + (du ? ' du' : '') + '"><div><span class="etiquette">Rachat estimé</span><input type="date" id="cmRachat" value="' + (rachat ? dateLocale(rachat) : '') + '"></div>' +
        (c.Tag === 'Won' ? '<button class="btn mini fantome danger" id="cmChurn">Ne recommande pas</button>' : '<span class="puce">' + esc(c.Tag === 'Lost' ? 'Churn' : c.Tag) + '</span>') + '</div>' +
      (du ? '<div class="rangee" style="margin:10px 0 2px"><span class="puce orange">' + ico('tel') + 'À appeler pour le rachat</span><button class="btn mini" id="cmSeqRachat">' + ico('sequence') + 'Pas de réponse → séquence</button></div>' : '') +
      '<div class="petit doux" style="margin:12px 0 6px">' + cmds.length + ' commande(s) · ' + euros(total) + ' HT</div>' +
      cmds.map(x => '<div class="ligne-cmd" data-cmd="' + x.ID + '"><span class="bulle Commande">' + ico('panier') + '</span><div style="flex:1;min-width:0"><b>' + esc(x.Type) + ' · ' + esc(x.Bidons) + ' bidons</b>' +
        '<div class="doux petit">' + esc(fmtDate(x.Date)) + ' · ' + euros(montantCommande(x), 2) + ' HT</div></div>' + pucePaiement(x) + ico('crayon') + '</div>').join('') +
    '</div></div>';
}

function brancherCommandes(c) {
  const n = $('#cmNouvelle');
  if (n) n.onclick = () => fenetreCommande(c);
  $$('[data-cmd]').forEach(l => l.onclick = () => fenetreCommande(c, S.d.commandes.find(x => x.ID === l.dataset.cmd)));
  const r = $('#cmRachat');
  if (r) r.onchange = () => r.value && enregistrerChamp(c.ID, 'Date rachat', new Date(r.value + 'T10:00').toISOString(), r);
  const ch = $('#cmChurn');
  if (ch) ch.onclick = () => fenetreChurn(c);
  const sq = $('#cmSeqRachat');
  if (sq) sq.onclick = () => fenetreSequence([c.ID]);
}

function fenetreCommande(c, x) {
  const r = S.d.reglages;
  const v = x || { Bidons: r.BIDONS_PAR_COMMANDE, 'Prix bidon HT': r.PRIX_BIDON_HT, 'Livraison HT': r.LIVRAISON_CLIENT_HT, Date: new Date().toISOString(), Notes: '' };
  const type = x ? x.Type : commandesDe(c.ID).length ? 'Rachat' : 'Nouvelle vente';
  const f = fenetre({ titre: (x ? 'Commande · ' : type + ' · ') + esc(nomClient(c)), corps:
    '<div class="grille-2"><label class="champ"><span>Bidons (1 carton = 4)</span><input type="number" id="cmB" min="1" step="1" value="' + esc(v.Bidons) + '"></label>' +
    '<label class="champ"><span>Date</span><input type="date" id="cmD" value="' + dateLocale(new Date(v.Date)) + '"></label>' +
    '<label class="champ"><span>Prix du bidon (€ HT)</span><input type="number" id="cmP" step="0.01" value="' + esc(v['Prix bidon HT']) + '"></label>' +
    '<label class="champ"><span>Livraison facturée (€ HT)</span><input type="number" id="cmL" step="0.01" value="' + esc(v['Livraison HT']) + '"></label></div>' +
    '<label class="champ"><span>Notes</span><input type="text" id="cmN" value="' + esc(v.Notes) + '" placeholder="Facture, mode de paiement…"></label>' +
    '<div class="total-cmd" id="cmTotal"></div>' +
    (x ? '<label class="interrupteur" style="display:flex;margin-top:12px"><input type="checkbox" id="cmPaye"' + (x['Payée le'] ? ' checked' : '') + '><i></i>' +
      (x.TransactionID ? 'Payée : virement Qonto du ' + esc(fmtDate(x['Payée le'])) : 'Payée' + (x['Payée le'] ? ' le ' + esc(fmtDate(x['Payée le'])) : ' (espèces, chèque… ; les virements Qonto sont cochés tout seuls)')) + '</label>' : '') +
    (!x ? '<p class="pale petit" style="margin:8px 0 0">Le client passe en Won, sa date de rachat est recalculée et une tâche d’appel est créée à cette date.</p>' : ''),
    pied: (x ? '<button class="btn danger gauche" id="cmSuppr">' + ico('poubelle') + 'Supprimer</button>' : '') + '<button class="btn" data-fermer>Annuler</button><button class="btn principal" id="cmOk">' + (x ? 'Enregistrer' : 'Enregistrer la vente') + '</button>' });
  const total = () => {
    const ht = (Number(f.$('#cmB').value) || 0) * (Number(f.$('#cmP').value) || 0) + (Number(f.$('#cmL').value) || 0);
    f.$('#cmTotal').innerHTML = '<span>Total</span><b>' + euros(ht, 2) + ' HT</b><span class="pale">' + euros(ht * (1 + (Number(r.TVA) || 0) / 100), 2) + ' TTC</span>';
  };
  ['#cmB', '#cmP', '#cmL'].forEach(k => f.$(k).oninput = total);
  total();
  f.$('#cmOk').onclick = () => {
    const o = { bidons: f.$('#cmB').value, prix: f.$('#cmP').value, livraison: f.$('#cmL').value, date: new Date(f.$('#cmD').value + 'T12:00').toISOString(), notes: f.$('#cmN').value.trim() };
    const paye = x && f.$('#cmPaye').checked;
    if (x) return occupe(f.$('#cmOk'), appel('crmModifierCommande', x.ID, Object.assign({ date: o.date, Bidons: o.bidons, 'Prix bidon HT': o.prix, 'Livraison HT': o.livraison, Notes: o.notes },
      paye !== !!x['Payée le'] ? { payee: paye } : {})))
      .then(y => { remplacer(S.d.commandes, y); if (!y.TransactionID) S.d.banque.forEach(b => { if (b.CommandeID === y.ID) { b.CommandeID = ''; b.Statut = 'À rapprocher'; } }); f.fermer(); afficher(); toast('Commande modifiée'); });
    occupe(f.$('#cmOk'), appel('crmCommande', Object.assign({ clientId: c.ID, auteur: S.moi }, o)))
      .then(y => { majClient(y); f.fermer(); afficher(); toast(type + ' enregistrée 🎉'); });
  };
  if (x) f.$('#cmSuppr').onclick = () => confirmer('Supprimer cette commande ?', 'Elle ne comptera plus dans les ventes ni dans le stock.', 'Supprimer').then(ok => ok &&
    appel('crmSupprimerCommande', x.ID).then(() => { S.d.commandes = S.d.commandes.filter(y => y.ID !== x.ID); f.fermer(); afficher(); toast('Commande supprimée'); }));
}

// =================================================================== Comparateur produits
const dernierComparatif = clientId => (S.d.comparatifs || []).filter(x => x.ClientID === clientId).sort((a, b) => String(b.Date).localeCompare(String(a.Date)))[0] || null;

function carteComparatifs(c) {
  const liste = (S.d.comparatifs || []).filter(x => x.ClientID === c.ID).sort((a, b) => String(b.Date).localeCompare(String(a.Date)));
  return '<div class="carte"><div class="carte-tete"><h2>Comparatifs produit</h2><button class="btn mini principal" id="cpOuvrir">' + ico('comparer') + 'Outil comparaison</button></div>' +
    (liste.length ? liste.map((x, n) => '<div class="ligne-cmd" style="cursor:default"><span class="bulle Comparatif">' + ico('comparer') + '</span><div style="flex:1;min-width:0"><b>H&amp;C / ' + esc(x.Produit || 'concurrent') + '</b>' +
        '<div class="doux petit">' + esc(fmtDate(x.Date)) + (x.Auteur ? ' · ' + esc(String(x.Auteur).split(' ')[0]) : '') + (n === 0 ? ' · <span class="puce vert" style="padding:0 6px">joint aux e-mails</span>' : '') + '</div></div>' +
        '<button class="btn mini" data-cp-voir="' + x.ID + '">Ouvrir</button><button class="btn fantome icone" data-cp-suppr="' + x.ID + '" aria-label="Supprimer">' + ico('poubelle') + '</button></div>').join('')
      : '') + '</div>';
}

function brancherComparatifs(c) {
  $('#cpOuvrir').onclick = () => ouvrirComparateur(c);
  $$('[data-cp-voir]').forEach(b => b.onclick = () => occupe(b, appel('crmLireComparatif', b.dataset.cpVoir)).then(r => {
    const octets = Uint8Array.from(atob(r.base64), x => x.charCodeAt(0));
    const url = URL.createObjectURL(new Blob([octets], { type: 'application/pdf' }));
    const a = document.createElement('a');
    a.href = url;
    if (matchMedia('(display-mode: standalone)').matches || navigator.standalone) a.download = r.nom; else a.target = '_blank';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }));
  $$('[data-cp-suppr]').forEach(b => b.onclick = () => confirmer('Supprimer ce comparatif ?', 'Le PDF sera retiré de la fiche. Les e-mails déjà envoyés ne changent pas.', 'Supprimer').then(ok => ok &&
    appel('crmSupprimerComparatif', b.dataset.cpSuppr).then(() => { S.d.comparatifs = S.d.comparatifs.filter(x => x.ID !== b.dataset.cpSuppr); pageFiche(); toast('Comparatif supprimé'); })));
}

/** L'outil de comparaison s'ouvre en plein écran par-dessus la fiche ; « Enregistrer sur la fiche » range le PDF chez ce client. */
function ouvrirComparateur(c) {
  const z = document.createElement('div');
  z.className = 'comparateur-plein';
  z.innerHTML = '<header>' + ico('comparer') + '<div><b>Outil comparaison</b><br><span>' + esc(nomClient(c)) + '</span></div><button class="btn mini" id="cpFermer">' + ico('croix') + 'Fermer</button></header>' +
    '<iframe title="Outil comparaison" src="comparateur/?client=' + encodeURIComponent(c.ID) + '&nom=' + encodeURIComponent(nomClient(c)) + '"></iframe>';
  document.body.appendChild(z);
  const recevoirMessage = e => {
    if (e.origin !== location.origin || !e.data || e.data.type !== 'crm-comparatif') return;
    if (e.data.comparatif) remplacer(S.d.comparatifs, e.data.comparatif);
    toast('Comparatif enregistré sur la fiche de ' + nomClient(c));
  };
  window.addEventListener('message', recevoirMessage);
  z.querySelector('#cpFermer').onclick = () => { window.removeEventListener('message', recevoirMessage); z.remove(); S.ongletFiche = 'suivi'; if (S.page === 'fiche') pageFiche(); };
}

function fenetreChurn(c) {
  const f = fenetre({ titre: 'Ne recommande pas · ' + esc(nomClient(c)), corps:
    '<p class="doux" style="margin-top:0">Le client passe en <b>Lost</b> et compte dans le churn. Les relances de rachat s’arrêtent.</p>' +
    '<label class="champ"><span>Raison</span><select id="chR">' + ['Pas satisfait du produit', 'Trop cher', 'A trouvé un autre fournisseur', 'Salle fermée', 'Pas de réponse', 'Autre'].map(o => '<option>' + o + '</option>').join('') + '</select></label>' +
    '<label class="champ"><span>Précisions</span><input type="text" id="chT" placeholder="Facultatif"></label>',
    pied: '<button class="btn" data-fermer>Annuler</button><button class="btn principal" id="chOk">Confirmer le churn</button>' });
  f.$('#chOk').onclick = () => occupe(f.$('#chOk'), appel('crmChurn', c.ID, [f.$('#chR').value, f.$('#chT').value.trim()].filter(Boolean).join(' · '), S.moi))
    .then(y => { majClient(y); f.fermer(); afficher(); toast('Client passé en Lost (churn)'); });
}

function carteSequence(c, ins) {
  if (!ins) {
    const derniere = S.d.inscriptions.filter(i => i.ClientID === c.ID).sort((a, b) => String(b['Créé le']).localeCompare(String(a['Créé le'])))[0];
    return '<div class="carte"><div class="carte-tete"><h2>Séquence</h2></div><div class="carte-corps"><p class="doux" style="margin:0">Aucune séquence en cours.' +
      (derniere ? '<br><span class="petit">Dernière : « ' + esc(derniere.Nom) + ' » — ' + esc(derniere.Statut.toLowerCase()) + '</span>' : '') + '</p></div></div>';
  }
  const etapes = ins['Étapes'] || [];
  const fait = Number(ins['Étape']) || 0;
  let jour = 0;
  return '<div class="carte"><div class="carte-tete"><h2>Séquence</h2><button class="btn mini danger" id="arretSeq">' + ico('stop') + 'Arrêter</button></div><div class="carte-corps">' +
    '<b>' + esc(ins.Nom) + '</b><div class="doux petit">Par ' + esc(ins.Owner || '—') + ' · étape ' + Math.min(fait + 1, etapes.length) + ' sur ' + etapes.length + '</div>' +
    '<div class="progression"><i style="width:' + Math.round(fait / Math.max(etapes.length, 1) * 100) + '%"></i></div>' +
    '<ul class="etapes-mini">' + etapes.map((e, i) => {
      jour += Number(e.delai) || 0;
      const etat = i < fait ? 'fait' : i === fait ? 'courant' : '';
      const libelle = e.type === 'email' ? (e.objet ? rendre(e.objet, variables(c, ins.Owner)) : 'Relance par e-mail') : rendre(e.titre, variables(c, ins.Owner)) || ETAPE_NOM[e.type];
      return '<li class="' + etat + '"><span class="pt">' + ico(i < fait ? 'ok' : ETAPE_ICONE[e.type]) + '</span><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' +
        esc(libelle) + '</span><span class="pale petit">' + (i === fait ? esc(relatif(ins.Prochain)) : i > fait && e.date ? esc(relatif(e.date)) : 'J+' + jour) + '</span></li>';
    }).join('') + '</ul></div></div>';
}

function carteAVenir(c) {
  const taches = S.d.taches.filter(t => t.ClientID === c.ID && !t.Faite).sort((a, b) => String(a['Échéance']).localeCompare(String(b['Échéance'])));
  const rdv = S.d.rdv.filter(r => r.ClientID === c.ID && new Date(r.Fin || r['Début']) >= new Date()).sort((a, b) => String(a['Début']).localeCompare(String(b['Début'])));
  return '<div class="carte"><div class="carte-tete"><h2>À venir</h2><span class="pale petit">' + (taches.length + rdv.length) + '</span></div>' +
    (taches.length || rdv.length ? rdv.map(r => '<div class="tache"><span class="type">' + ico('rdv') + '</span><div class="corps"><b>' + esc(r.Titre) + '</b><div class="sous">' +
      esc(fmtJourHeure(r['Début'])) + (r.Lieu ? ' · ' + esc(r.Lieu) : '') + '</div></div></div>').join('') + taches.map((t, n) => ligneTache(t, n, true)).join('')
      : '<div class="carte-corps doux">Aucune tâche ni rendez-vous.</div>') + '</div>';
}

// =================================================================== Appel, note
const dureeTexte = s => s < 60 ? s + ' s' : Math.floor(s / 60) + ' min ' + String(s % 60).padStart(2, '0');

function fenetreAppel(c, tache) {
  const tel = telNettoye(c['Téléphone']), tel2 = telNettoye(c['Téléphone 2']);
  const f = fenetre({ titre: 'Appel · ' + esc(nomClient(c)), corps:
    (tel ? '<a class="btn principal" data-composer href="tel:' + esc(tel) + '" style="width:100%;padding:12px;margin-bottom:' + (tel2 ? 8 : 16) + 'px">' + ico('tel') + 'Composer le ' + esc(c['Téléphone']) + '</a>'
      : '<p class="doux" style="margin-top:0">Pas de numéro sur la fiche.</p>') +
    (tel2 ? '<a class="btn" data-composer href="tel:' + esc(tel2) + '" style="width:100%;margin-bottom:16px">' + ico('tel') + '2e numéro : ' + esc(c['Téléphone 2']) + '</a>' : '') +
    '<div class="piece-jointe" id="apDuree" hidden>' + ico('horloge') + '<span></span></div>' +
    '<div class="champ"><span class="doux petit" style="display:block;margin-bottom:6px">Résultat</span><div class="segment" id="apRes">' +
      ['Joint', 'Pas de réponse', 'Messagerie', 'Mauvais numéro'].map((r, i) => '<button data-r="' + r + '" class="' + (i === 0 ? 'actif' : '') + '">' + r + '</button>').join('') + '</div></div>' +
    '<label class="champ"><span>Compte rendu</span><textarea id="apTxt" placeholder="Ce qui s’est dit, besoins, objections…"></textarea></label>' +
    '<div class="champ"><span class="doux petit" style="display:block;margin-bottom:6px">Tag après l’appel <b style="color:var(--danger)">*</b> <span class="pale">(obligatoire pour valider · actuel : ' + esc(c.Tag || '—') + ')</span></span>' +
      '<div class="choix-tag" id="apTags" style="margin-bottom:14px">' + S.d.tags.map(t => '<button type="button" data-aptag="' + t + '">' + t + '</button>').join('') + '</div></div>' +
    '<label class="champ"><span>Devis</span><select id="apDevis"><option value="">Inchangé (' + esc(c.Devis || 'Aucun') + ')</option>' + S.d.devis.map(t => '<option>' + t + '</option>').join('') + '</select></label>' +
    '<label class="interrupteur" style="margin-bottom:12px"><input type="checkbox" id="apRappel"><i></i>Programmer un rappel</label>' +
    '<div id="apZone" class="grille-2" style="display:none"><label class="champ"><span>Date</span><input type="date" id="apDate" value="' + dateLocale(new Date(Date.now() + 864e5)) + '"></label>' +
      '<label class="champ"><span>Heure</span><input type="time" id="apHeure" value="10:00"></label></div>',
    pied: '<span class="gauche pale petit" id="apAide">Choisissez un tag pour valider</span><button class="btn" data-fermer id="apAnnuler">Annuler</button><button class="btn principal" id="apOk" disabled>Enregistrer l’appel</button>', fermable: false });
  let resultat = 'Joint', tag = '';
  // Choisir le tag est obligatoire pour valider l'appel
  f.el.querySelectorAll('[data-aptag]').forEach(b => b.onclick = () => {
    tag = b.dataset.aptag;
    f.el.querySelectorAll('[data-aptag]').forEach(x => { x.className = x === b ? 'actif tag ' + tag : ''; });
    f.$('#apOk').disabled = false;
    f.$('#apAide').textContent = '';
  });
  // Durée de l'appel, mesurée sans service payant : temps passé hors de l'app (iPhone) ou hors de la fenêtre (Mac, appel via l'iPhone).
  let depart = 0, absent = 0, duree = 0;
  const choisirResultat = r => f.el.querySelectorAll('#apRes button').forEach(x => { if (x.dataset.r === r) x.click(); });
  const quitte = () => { if (depart && !absent) absent = Date.now(); };
  const revient = () => {
    if (!depart || !absent) return;
    duree = Math.round((Date.now() - absent) / 1000);
    absent = 0;
    const z = f.$('#apDuree');
    z.hidden = false;
    z.querySelector('span').innerHTML = 'Durée de l’appel : <b>' + dureeTexte(duree) + '</b> (estimée)' + (duree < 20 ? ' · probablement pas de réponse' : '');
    choisirResultat(duree < 20 ? 'Pas de réponse' : 'Joint');
  };
  const surVisibilite = () => (document.hidden ? quitte() : revient());
  document.addEventListener('visibilitychange', surVisibilite);
  window.addEventListener('blur', quitte);
  window.addEventListener('focus', revient);
  const fermer = f.fermer;
  f.fermer = () => { document.removeEventListener('visibilitychange', surVisibilite); window.removeEventListener('blur', quitte); window.removeEventListener('focus', revient); fermer(); };
  // Appel composé : un « New » passe en Qualifying, et la fenêtre ne se ferme plus qu'en enregistrant l'appel
  f.el.querySelectorAll('[data-composer]').forEach(a => a.addEventListener('click', () => {
    depart = Date.now();
    f.$('#apAnnuler').hidden = true;
    f.$('#apAide').textContent = 'Appel en cours : choisissez un tag pour valider';
    if (c.Tag === 'New') { enregistrerChamps(c.ID, { Tag: 'Qualifying' }); toast(nomClient(c) + ' passe en Qualifying'); }
  }));
  f.el.querySelectorAll('#apRes button').forEach(b => b.onclick = () => { resultat = b.dataset.r; f.el.querySelectorAll('#apRes button').forEach(x => x.classList.toggle('actif', x === b)); });
  f.$('#apRappel').onchange = e => { f.$('#apZone').style.display = e.target.checked ? 'grid' : 'none'; };
  f.$('#apOk').onclick = () => {
    const texte = [duree ? 'Durée : ' + dureeTexte(duree) : '', f.$('#apTxt').value.trim()].filter(Boolean).join('\n');
    const etapes = [appel('crmActivite', { clientId: c.ID, type: 'Appel', resultat, texte, auteur: S.moi })
      .then(r => { S.d.activites.push(r.activite); if (r.client) majClient(r.client); })];
    const changes = {};
    if (!tag) return toast('Choisissez un tag pour valider l’appel', true);
    if (tag !== client(c.ID).Tag) changes.Tag = tag;
    if (f.$('#apDevis').value) changes.Devis = f.$('#apDevis').value;
    if (Object.keys(changes).length) etapes.push(appel('crmEnregistrerClient', c.ID, changes).then(x => majClient(x)));
    if (f.$('#apRappel').checked) etapes.push(appel('crmTache', { clientId: c.ID, type: 'Appel', titre: 'Rappeler ' + (c['Prénom'] || nomClient(c)),
      echeance: versIso(f.$('#apDate').value, f.$('#apHeure').value), owner: c.Owner || S.moi, rappel: true }).then(r => { S.d.taches.push(r.tache); if (r.avertissement) toast(r.avertissement, true); }));
    if (tache) etapes.push(appel('crmTacheFaite', tache.ID, true).then(t => { remplacer(S.d.taches, t); if (S.tacheEnCours === t.ID) S.tacheEnCours = null; }));
    occupe(f.$('#apOk'), Promise.all(etapes)).then(() => { f.fermer(); afficher(); toast('Appel enregistré'); });
  };
}

function fenetreNote(c) {
  const f = fenetre({ titre: 'Note · ' + esc(nomClient(c)), corps: '<textarea id="noTxt" style="min-height:140px" placeholder="Votre note…"></textarea>',
    pied: '<button class="btn" data-fermer>Annuler</button><button class="btn principal" id="noOk">Ajouter la note</button>' });
  f.$('#noOk').onclick = () => {
    const texte = f.$('#noTxt').value.trim();
    if (!texte) return;
    // affichée tout de suite, enregistrée en arrière-plan
    const provisoire = { ID: 'tmp' + Date.now(), ClientID: c.ID, Date: new Date().toISOString(), Type: 'Note', 'Résultat': '', Auteur: S.moi, Texte: texte };
    S.d.activites.push(provisoire);
    f.fermer(); afficher(); toast('Note ajoutée');
    appel('crmActivite', { clientId: c.ID, type: 'Note', texte, auteur: S.moi })
      .then(r => { remplacer(S.d.activites, Object.assign(r.activite, {})); S.d.activites = S.d.activites.filter(a => a.ID !== provisoire.ID); if (S.page === 'fiche') afficher(); })
      .catch(() => { S.d.activites = S.d.activites.filter(a => a.ID !== provisoire.ID); afficher(); });
  };
}

// =================================================================== Inscription dans une séquence
function optionsSequences(choisi) {
  const cats = [...new Set(S.d.sequences.map(s => s['Catégorie'] || 'Divers'))];
  return cats.map(cat => '<optgroup label="' + esc(cat) + '">' + S.d.sequences.filter(s => (s['Catégorie'] || 'Divers') === cat)
    .map(s => '<option value="' + s.ID + '"' + (s.ID === choisi ? ' selected' : '') + '>' + esc(s.Nom) + '</option>').join('') + '</optgroup>').join('');
}
function sequenceConseillee(c) {
  const nom = !c ? '' : c.Tag === 'Won' && c['Date rachat'] && new Date(c['Date rachat']) <= new Date(Date.now() + 7 * 864e5) ? 'Rachat ·' : c.Tag === 'Won' ? 'Won · Onboarding' : c.Tag === 'Lost' ? 'Lost' : c.Devis === 'Envoyé' ? 'Post-devis · Qualified' :
    c.Tag === 'Qualified' ? 'Pré-devis · Qualified' : ['Unqualified', 'Qualifying'].includes(c.Tag) ? 'Pré-devis · Unqualified' : 'Pré-devis · New';
  const s = S.d.sequences.find(x => x.Nom.startsWith(nom)) || S.d.sequences[0];
  return s ? s.ID : '';
}

/**
 * Inscription façon HubSpot : départ (maintenant, demain, 1 jour ouvré, date au choix), frise des étapes,
 * chaque étape décalable de −1 / +1 jour (les suivantes suivent) et modifiable avant le lancement.
 */
function fenetreSequence(ids) {
  if (!S.d.sequences.length) return toast('Créez d’abord une séquence (onglet E-mails)', true);
  const seul = ids.length === 1 ? client(ids[0]) : null;
  const hDebut = Number(S.d.reglages.HEURE_DEBUT) || 9, hFin = Number(S.d.reglages.HEURE_FIN) || 18;
  const f = fenetre({ titre: seul ? 'Inscrire ' + esc(nomClient(seul)) + ' dans une séquence' : 'Inscrire ' + ids.length + ' clients dans une séquence', large: true, corps:
    '<div class="grille-2"><label class="champ"><span>Séquence</span><select id="sqChoix">' + optionsSequences(sequenceConseillee(seul)) + '</select></label>' +
    '<label class="champ"><span>Envoyée par (signature et tâches)</span><select id="sqOwner"><option value="">Owner de chaque client</option>' +
      S.d.owners.map(o => '<option' + (seul && (seul.Owner || S.moi) === o ? ' selected' : '') + '>' + esc(o) + '</option>').join('') + '</select></label></div>' +
    '<p class="doux petit" id="sqDesc" style="margin:-4px 0 14px"></p>' +
    '<div class="plan-depart"><span class="etiquette">Premier envoi</span>' +
      '<div class="segment defilant" id="sqQuand"><button data-q="maintenant" class="actif">Maintenant</button><button data-q="demain">Demain</button>' +
        '<button data-q="ouvre">1 jour ouvré</button><button data-q="date">Date précise</button></div>' +
      '<div class="rangee" id="sqDateLibre" hidden><input type="date" id="sqJour" style="width:auto"><input type="time" id="sqHeure" style="width:auto"></div>' +
      '<label class="interrupteur petit"><input type="checkbox" id="sqOuvres" checked><i></i>Relances en jours ouvrés (samedi, dimanche → lundi)</label></div>' +
    '<div class="frise-zone"><div class="frise" id="sqFrise"><div class="frise-jours"></div><div class="frise-marques"></div></div></div>' +
    '<div class="rangee" style="margin:0 0 10px"><span class="etiquette">Étapes</span><span class="pale petit">−1 / +1 décale d’un jour (les suivantes suivent) · cliquez une étape pour la modifier</span></div>' +
    (seul ? '' : '<p class="doux petit" style="margin:0 0 8px">Textes communs : les variables sont remplacées pour chaque client.</p>' + boutonsVariables()) +
    '<div id="sqEtapes" class="plan"></div>' +
    '<div class="rangee doux petit" id="sqRetirees" hidden>' + ico('poubelle') + '<span><b id="sqRetireesNb">0</b> étape(s) retirée(s) pour cette inscription</span><button type="button" class="btn mini" id="sqRetablir">Rétablir</button></div>',
    pied: '<span class="gauche pale petit" id="sqResume"></span><button class="btn" data-fermer>Annuler</button><button class="btn principal" id="sqOk">' + ico('lancer') + 'Inscrire</button>' });

  const L = 36; // largeur d'un jour dans la frise
  const estWE = d => d.getDay() === 0 || d.getDay() === 6;
  const plusJours = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const ecart = (a, b) => Math.round((debutJour(b) - debutJour(a)) / 864e5);
  const jourCourt = d => d.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' });
  let s = null, etapes = [], ecartFixe = [], heures = []; // ecartFixe[i] : jours après l'étape précédente, choisis avec −1 / +1
  let actif = [], avantRetrait = null; // étapes retirées pour cette inscription, et l'état d'avant pour « Rétablir »
  const vivantes = () => etapes.map((_, i) => i).filter(i => actif[i]);
  let depart = 'maintenant', debut = new Date(), eviterWE = true;

  const heureDefaut = () => {
    const h = debut.getHours();
    return h >= hDebut && h < hFin ? p2(h) + ':' + p2(debut.getMinutes() - debut.getMinutes() % 5) : p2(hDebut) + ':00';
  };
  /** Date de chaque étape : la précédente + son délai (week-end sauté si demandé) ou l'écart choisi à la main, à l'heure prévue. */
  function dates() {
    const res = [];
    let prec = null;
    etapes.forEach((e, i) => {
      if (!actif[i]) return;
      if (!prec) { prec = res[i] = new Date(debut); return; }
      const fixe = ecartFixe[i] !== null;
      let d = plusJours(prec, fixe ? ecartFixe[i] : Number(e.delai) || 0);
      const [h, m] = (heures[i] || heureDefaut()).split(':').map(Number);
      d.setHours(h, m, 0, 0);
      if (eviterWE && !fixe) while (estWE(d)) d = plusJours(d, 1);
      prec = res[i] = d < prec ? new Date(prec) : d;
    });
    return res; // indexé comme `etapes` (vide pour une étape retirée)
  }
  function choisirDepart(q) {
    depart = q;
    const matin = d => { d.setHours(hDebut, 0, 0, 0); return d; };
    if (q === 'maintenant') debut = new Date();
    if (q === 'demain') debut = matin(plusJours(new Date(), 1));
    if (q === 'ouvre') { let d = plusJours(new Date(), 1); while (estWE(d)) d = plusJours(d, 1); debut = matin(d); }
    if (q === 'date' && debut < new Date()) debut = matin(plusJours(new Date(), 1));
    f.el.querySelectorAll('#sqQuand button').forEach(b => b.classList.toggle('actif', b.dataset.q === depart));
    f.$('#sqDateLibre').hidden = depart !== 'date';
    majDates();
  }

  function dessiner() {
    const autre = !s || s.ID !== f.$('#sqChoix').value; // changer d'owner garde les décalages
    s = S.d.sequences.find(x => x.ID === f.$('#sqChoix').value);
    etapes = s ? s['Étapes'] : [];
    if (autre) { ecartFixe = etapes.map(() => null); heures = etapes.map(() => ''); actif = etapes.map(() => true); avantRetrait = null; }
    const vars = seul ? variables(seul, f.$('#sqOwner').value || seul.Owner) : null;
    const r = v => seul ? rendre(v, vars) : String(v ?? '');
    f.$('#sqDesc').textContent = s ? s.Description || '' : '';
    let filOuvert = false;
    f.$('#sqRetirees').hidden = !avantRetrait;
    f.$('#sqEtapes').innerHTML = etapes.map((e, i) => !actif[i] ? '' : (() => {
      const titre = e.type === 'email' ? (e.objet ? r(e.objet) : 'Relance dans le même fil') : r(e.titre) || ETAPE_NOM[e.type];
      const sous = e.type === 'email' ? (e.objet || !filOuvert ? 'E-mail · nouveau fil' : 'E-mail · réponse dans le fil') : e.type === 'appel' ? 'Tâche d’appel' : 'Tâche';
      if (e.type === 'email') filOuvert = true;
      const contenu = e.type === 'email'
        ? (e.objet ? '<label class="champ"><span>Objet</span><input type="text" data-i="' + i + '" data-k="objet" value="' + esc(r(e.objet)) + '"></label>' : '') +
          '<label class="champ"><span>Message</span><textarea data-i="' + i + '" data-k="message" style="min-height:170px">' + esc(r(e.message)) + '</textarea></label>'
        : '<label class="champ"><span>Tâche</span><input type="text" data-i="' + i + '" data-k="titre" value="' + esc(r(e.titre)) + '"></label>' +
          '<label class="champ"><span>Notes</span><textarea data-i="' + i + '" data-k="notes">' + esc(r(e.notes)) + '</textarea></label>';
      return '<div class="plan-etape" data-e="' + i + '" style="--n:' + i + '"><span class="plan-pt ' + e.type + '">' + ico(ETAPE_ICONE[e.type]) + '</span>' +
        '<div class="plan-carte"><div class="plan-ligne">' +
          '<button type="button" class="plan-titre" data-ouvre><b>' + esc(titre) + '</b><small><span data-jplus></span> · ' + sous + '<span data-we></span></small></button>' +
          '<div class="plan-quand"><button type="button" class="btn mini" data-dec="-1" aria-label="Un jour plus tôt">−1</button>' +
            '<div class="plan-date"><b data-jour></b><input type="time" data-heure aria-label="Heure"></div>' +
            '<button type="button" class="btn mini" data-dec="1" aria-label="Un jour plus tard">+1</button></div>' +
          '<button type="button" class="btn fantome icone plan-retirer" data-retirer aria-label="Retirer cette étape" title="Retirer cette étape">' + ico('poubelle') + '</button>' +
          '<button type="button" class="btn fantome icone plan-fleche" data-ouvre aria-label="Modifier">' + ico('bas') + '</button></div>' +
        '<div class="plan-contenu" hidden>' + contenu + '</div></div></div>';
    })()).join('') || '<p class="doux">Cette séquence n’a aucune étape.</p>';
    f.$('.frise-marques').innerHTML = etapes.map((e, i) => !actif[i] ? '' : '<button type="button" class="frise-m ' + e.type + '" data-m="' + i + '" title="Étape ' + (i + 1) + ' · ' + ETAPE_NOM[e.type] + '">' + ico(ETAPE_ICONE[e.type]) + '</button>').join('');
    f.$('#sqEtapes').querySelectorAll('.plan-etape').forEach(ligne => {
      const i = Number(ligne.dataset.e);
      ligne.querySelectorAll('[data-ouvre]').forEach(b => b.onclick = () => ouvrir(i));
      ligne.querySelectorAll('[data-dec]').forEach(b => b.onclick = () => decaler(i, Number(b.dataset.dec)));
      ligne.querySelector('[data-retirer]').onclick = () => retirer(i);
      ligne.querySelector('[data-heure]').onchange = ev => {
        if (!ev.target.value) return;
        if (i) heures[i] = ev.target.value;
        else { const [h, m] = ev.target.value.split(':').map(Number); debut = new Date(debut); debut.setHours(h, m, 0, 0); }
        majDates();
      };
      const objet = ligne.querySelector('[data-k=objet]');
      if (objet) objet.addEventListener('input', () => { ligne.querySelector('.plan-titre b').textContent = objet.value || 'Sans objet'; });
    });
    f.el.querySelectorAll('.frise-m').forEach(m => m.onclick = () => ouvrir(Number(m.dataset.m), true));
    if (!seul) brancherVariables(f.el);
    majDates();
  }

  function ouvrir(i, defiler) {
    const ligne = f.$('.plan-etape[data-e="' + i + '"]');
    const c = ligne.querySelector('.plan-contenu');
    const ouvert = defiler ? true : c.hidden;
    c.hidden = !ouvert;
    ligne.classList.toggle('ouvert', ouvert);
    if (defiler) ligne.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  /** Retire une étape de cette inscription ; les suivantes gardent leur date. */
  function retirer(i) {
    const O = vivantes();
    if (O.length < 2) return;
    if (!avantRetrait) avantRetrait = { actif: actif.slice(), ecartFixe: ecartFixe.slice() };
    const D = dates(), k = O.indexOf(i), suivante = O[k + 1];
    if (k > 0 && suivante !== undefined) ecartFixe[suivante] = ecart(D[O[k - 1]], D[suivante]);
    actif[i] = false;
    const ligne = f.$('.plan-etape[data-e="' + i + '"]');
    const marque = f.$('.frise-m[data-m="' + i + '"]');
    if (marque) marque.remove();
    ligne.classList.add('retiree');
    setTimeout(() => { ligne.remove(); majDates(); }, 220);
    f.$('#sqRetirees').hidden = false;
    f.$('#sqRetireesNb').textContent = actif.filter(x => !x).length;
  }

  function decaler(i, n) {
    const O = vivantes();
    if (i === O[0]) {
      debut = plusJours(depart === 'maintenant' ? new Date() : debut, n);
      depart = 'date';
      f.el.querySelectorAll('#sqQuand button').forEach(b => b.classList.toggle('actif', b.dataset.q === 'date'));
      f.$('#sqDateLibre').hidden = false;
    } else { const D = dates(); ecartFixe[i] = Math.max(0, ecart(D[O[O.indexOf(i) - 1]], D[i]) + n); }
    majDates(i);
  }

  function majDates(bouge) {
    const D = dates(), O = vivantes();
    if (!O.length) { f.$('#sqResume').textContent = ''; return; }
    const premier = D[O[0]], dernier = D[O[O.length - 1]];
    f.$('#sqJour').value = dateLocale(debut);
    f.$('#sqHeure').value = heureLocale(debut);
    f.$('#sqEtapes').querySelectorAll('.plan-etape').forEach(ligne => {
      const i = Number(ligne.dataset.e), d = D[i], k = O.indexOf(i);
      if (k < 0) return; // en train de disparaître
      ligne.querySelector('[data-jour]').textContent = !k && depart === 'maintenant' ? 'Maintenant' : jourCourt(d);
      const h = ligne.querySelector('[data-heure]');
      h.hidden = !k && depart === 'maintenant';
      if (document.activeElement !== h) h.value = heureLocale(d);
      ligne.querySelector('[data-jplus]').textContent = 'J+' + ecart(premier, d);
      ligne.querySelector('[data-retirer]').disabled = O.length < 2;
      ligne.querySelector('[data-we]').innerHTML = estWE(d) ? ' <span class="puce orange mini-puce">week-end</span>' : '';
      ligne.querySelector('[data-dec="-1"]').disabled = k ? ecart(D[O[k - 1]], d) <= 0 : depart === 'maintenant' || plusJours(d, -1) < new Date();
      if (bouge !== undefined && i >= bouge) {
        const date = ligne.querySelector('.plan-date');
        date.classList.remove('bouge'); void date.offsetWidth; date.classList.add('bouge');
      }
    });
    // Frise : un jour par colonne, week-ends hachurés, une pastille par étape (empilées si même jour).
    const nb = Math.max(ecart(premier, dernier) + 2, 8);
    const pile = {}, marques = {};
    O.forEach(i => { const k = ecart(premier, D[i]); pile[k] = (pile[k] || 0) + 1; marques[i] = { k, rang: pile[k] - 1 }; });
    const hauteur = 54 + Math.max(...Object.values(pile)) * 30;
    const frise = f.$('#sqFrise');
    frise.style.width = nb * L + 'px';
    frise.style.height = hauteur + 'px';
    const aujourdhui = debutJour();
    f.$('.frise-jours').innerHTML = Array.from({ length: nb }, (_, k) => {
      const d = plusJours(debutJour(premier), k);
      return '<div class="frise-j' + (estWE(d) ? ' we' : '') + (d.getDay() === 1 ? ' lundi' : '') + (+d === +aujourdhui ? ' auj' : '') + '"><small>' + 'DLMMJVS'[d.getDay()] + '</small><b>' + d.getDate() + '</b>' +
        (k === 0 || d.getDate() === 1 ? '<i>' + d.toLocaleDateString('fr-FR', { month: 'short' }) + '</i>' : '') + '</div>';
    }).join('');
    f.el.querySelectorAll('.frise-m').forEach(m => {
      const i = Number(m.dataset.m);
      if (!marques[i]) return;
      m.style.left = (marques[i].k * L + (L - 26) / 2) + 'px';
      m.style.top = (52 + marques[i].rang * 30) + 'px';
    });
    const emails = O.filter(i => etapes[i].type === 'email').length;
    f.$('#sqResume').textContent = emails + ' e-mail(s) · ' + (O.length - emails) + ' tâche(s) · dernière étape ' + jourCourt(dernier);
  }

  f.el.querySelectorAll('#sqQuand button').forEach(b => b.onclick = () => choisirDepart(b.dataset.q));
  f.$('#sqOuvres').onchange = e => { eviterWE = e.target.checked; majDates(1); };
  const dateLibre = () => {
    const [a, mo, j] = f.$('#sqJour').value.split('-').map(Number);
    const [h, mi] = (f.$('#sqHeure').value || p2(hDebut) + ':00').split(':').map(Number);
    if (!a) return;
    debut = new Date(a, mo - 1, j, h, mi);
    majDates(0);
  };
  f.$('#sqJour').onchange = dateLibre;
  f.$('#sqHeure').onchange = dateLibre;
  f.$('#sqChoix').onchange = dessiner;
  f.$('#sqOwner').onchange = dessiner;
  f.$('#sqRetablir').onclick = () => {
    if (!avantRetrait) return;
    actif = avantRetrait.actif;
    ecartFixe = avantRetrait.ecartFixe;
    avantRetrait = null;
    dessiner();
  };
  dessiner();

  f.$('#sqOk').onclick = () => {
    if (!s) return;
    const maintenant = depart === 'maintenant';
    const D = dates(), O = vivantes();
    if (!maintenant && D[O[0]] < new Date(Date.now() - 60000)) return toast('La date du premier envoi est déjà passée', true);
    const modifiees = etapes.map((e, i) => Object.assign({}, e, { date: (maintenant && i === O[0] ? new Date() : D[i] || new Date()).toISOString() }));
    f.el.querySelectorAll('[data-i]').forEach(ch => { modifiees[Number(ch.dataset.i)][ch.dataset.k] = ch.value; });
    const envoi = O.map(i => modifiees[i]);
    // Premier e-mail retiré : la relance qui le remplace ouvre le fil avec l'objet d'origine.
    const premierMail = envoi.find(e => e.type === 'email');
    if (premierMail && !String(premierMail.objet || '').trim()) premierMail.objet = (modifiees.find(e => e.type === 'email' && e.objet) || {}).objet || '';
    occupe(f.$('#sqOk'), appel('crmInscrire', { clientIds: ids, sequenceId: s.ID, owner: f.$('#sqOwner').value, maintenant, etapes: envoi })).then(r => {
      S.d = r.data;
      S.selection.clear();
      f.fermer();
      afficher();
      toast(r.inscrits ? r.inscrits + ' client(s) inscrit(s) dans « ' + s.Nom + ' »' + (maintenant ? ' · 1re étape lancée' : ' · 1er envoi ' + relatif(D[O[0]].toISOString())) : 'Aucune inscription', !r.inscrits);
      if (r.ignores.length) setTimeout(() => toast('Ignorés : ' + r.ignores.join(' ; '), true), 400);
    });
  };
}

// =================================================================== Tâches
function ligneTache(t, n, compact) {
  const c = client(t.ClientID);
  const ech = t['Échéance'] ? new Date(t['Échéance']) : null;
  const enRetard = ech && !t.Faite && ech < new Date();
  const appelTel = t.Type === 'Appel' && c && telNettoye(c['Téléphone']);
  return '<div class="tache' + (t.Faite ? ' faite' : '') + '"' + (c ? ' data-tache-ouvrir="' + t.ID + '" title="Ouvrir la fiche de ' + esc(nomClient(c)) + '"' : '') + ' style="--n:' + Math.min(n || 0, 25) + '"><input type="checkbox" class="case ronde" data-faite="' + t.ID + '"' + (t.Faite ? ' checked' : '') + ' aria-label="Terminée">' +
    '<span class="type">' + ico(t.Type === 'Appel' ? 'tel' : 'tache') + '</span>' +
    '<div class="corps"><b>' + esc(t.Titre) + '</b><div class="sous">' +
      (ech ? '<span class="' + (enRetard ? 'retard' : '') + '">' + esc(relatif(t['Échéance'])) + '</span>' : '<span>Sans date</span>') +
      (c && !compact ? '<a href="#" data-ouvrir="' + c.ID + '">' + esc(nomClient(c)) + '</a>' : '') +
      (t.EventId ? '<span title="Rappel Google Agenda">🔔</span>' : '') + '</div>' +
      (t.Notes && !compact ? '<div class="sous" style="white-space:pre-wrap">' + esc(t.Notes) + '</div>' : '') + '</div>' +
    (appelTel && !t.Faite ? '<button class="btn mini" data-appeler="' + t.ID + '">' + ico('tel') + 'Appeler</button>' : '') +
    (compact ? '' : avatar(t.Owner || '?', 's')) +
    '<button class="btn fantome icone" data-modif="' + t.ID + '" aria-label="Modifier">' + ico('crayon') + '</button></div>';
}

/** Ouvre la fiche du client d'une tâche ; la tâche s'affiche en haut de la fiche avec le bouton pour la faire. */
function ouvrirTache(tacheId, clientId) {
  const t = S.d.taches.find(x => x.ID === tacheId);
  S.tacheEnCours = t && !t.Faite ? t.ID : null;
  aller('fiche', clientId || (t && t.ClientID));
}

/** Bandeau « Tâche à faire » en haut de la fiche : appeler, répondre par e-mail, comparatif… puis la tâche est marquée faite. */
function bandeauTache(c) {
  const t = S.tacheEnCours && S.d.taches.find(x => x.ID === S.tacheEnCours && x.ClientID === c.ID && !x.Faite);
  if (!t) return '';
  const action = t.Type === 'Appel' ? ['tel', 'Appeler'] : /^Répondre/.test(t.Titre) ? ['mail', 'Répondre par e-mail'] : /^Comparatif/.test(t.Titre) ? ['comparer', 'Faire le comparatif'] : null;
  return '<div class="bandeau-tache">' + ico(t.Type === 'Appel' ? 'tel' : 'tache') + '<div class="quoi"><b>' + esc(t.Titre) + '</b><span>' +
    (t['Échéance'] ? esc(relatif(t['Échéance'])) : 'Sans date') + (t.Notes ? ' · ' + esc(String(t.Notes).split('\n')[0]) : '') + '</span></div><div class="rangee">' +
    (action ? '<button class="btn principal mini" id="btFaire">' + ico(action[0]) + action[1] + '</button>' : '') +
    '<button class="btn mini" id="btFaite">' + ico('ok') + 'Marquer faite</button><button class="btn fantome icone" id="btFermer" aria-label="Masquer">' + ico('croix') + '</button></div></div>';
}
function brancherBandeauTache(c) {
  const t = S.tacheEnCours && S.d.taches.find(x => x.ID === S.tacheEnCours);
  if (!t || !$('#btFaite')) return;
  const finir = () => appel('crmTacheFaite', t.ID, true).then(x => { remplacer(S.d.taches, x); S.tacheEnCours = null; if (S.page === 'fiche') pageFiche(); toast('Tâche terminée'); });
  $('#btFaite').onclick = finir;
  $('#btFermer').onclick = () => { S.tacheEnCours = null; pageFiche(); };
  const faire = $('#btFaire');
  if (faire) faire.onclick = () => t.Type === 'Appel' ? fenetreAppel(c, t) : /^Répondre/.test(t.Titre) ? fenetreEmail(c, finir) : ouvrirComparateur(c);
}

function brancherTaches() {
  $$('[data-faite]').forEach(i => i.onchange = () => {
    const ligne = i.closest('.tache');
    if (ligne) ligne.classList.toggle('faite', i.checked);
    appel('crmTacheFaite', i.dataset.faite, i.checked).then(t => { remplacer(S.d.taches, t); setTimeout(afficher, 350); if (i.checked) toast('Tâche terminée'); });
  });
  $$('[data-ouvrir]').forEach(a => a.onclick = e => { e.preventDefault(); e.stopPropagation(); const t = a.closest('[data-tache-ouvrir]'); ouvrirTache(t ? t.dataset.tacheOuvrir : null, a.dataset.ouvrir); });
  // Toute la ligne ouvre la fiche du client, avec la tâche à faire en haut (sauf la case, les boutons et les liens)
  $$('[data-tache-ouvrir]').forEach(l => l.addEventListener('click', e => { if (e.target.closest('input, button, a')) return; ouvrirTache(l.dataset.tacheOuvrir); }));
  $$('[data-modif]').forEach(b => b.onclick = () => fenetreTache(S.d.taches.find(t => t.ID === b.dataset.modif)));
  $$('[data-appeler]').forEach(b => b.onclick = () => { const t = S.d.taches.find(x => x.ID === b.dataset.appeler); fenetreAppel(client(t.ClientID), t); });
}

function selectClient(id, idChamp) {
  const tries = S.d.clients.slice().sort((a, b) => nomClient(a).localeCompare(nomClient(b)));
  return '<select id="' + idChamp + '"><option value="">— Aucun client —</option>' + tries.map(c => '<option value="' + c.ID + '"' + (c.ID === id ? ' selected' : '') + '>' + esc(nomClient(c)) + '</option>').join('') + '</select>';
}

function fenetreTache(t) {
  t = t || {};
  const ech = t['Échéance'] ? new Date(t['Échéance']) : new Date(Date.now() + 3600e3);
  let type = t.Type || 'Appel';
  const f = fenetre({ titre: t.ID ? 'Modifier la tâche' : 'Nouvelle tâche', corps:
    '<div class="segment" id="taType" style="margin-bottom:14px">' + ['Appel', 'Tâche'].map(x => '<button data-t="' + x + '" class="' + (type === x ? 'actif' : '') + '">' + ico(x === 'Appel' ? 'tel' : 'tache') + ' ' + x + '</button>').join('') + '</div>' +
    '<label class="champ"><span>Quoi ?</span><input type="text" id="taTitre" value="' + esc(t.Titre || '') + '" placeholder="Ex. : Rappeler pour le devis"></label>' +
    '<label class="champ"><span>Client</span>' + selectClient(t.ClientID, 'taClient') + '</label>' +
    '<div class="grille-2"><label class="champ"><span>Date</span><input type="date" id="taDate" value="' + dateLocale(ech) + '"></label>' +
    '<label class="champ"><span>Heure</span><input type="time" id="taHeure" value="' + heureLocale(ech) + '"></label></div>' +
    '<label class="champ"><span>Pour</span><select id="taOwner">' + S.d.owners.map(o => '<option' + ((t.Owner || S.moi) === o ? ' selected' : '') + '>' + esc(o) + '</option>').join('') + '</select></label>' +
    '<label class="champ"><span>Notes</span><textarea id="taNotes" style="min-height:70px">' + esc(t.Notes || '') + '</textarea></label>' +
    '<label class="interrupteur"><input type="checkbox" id="taRappel"' + (t.ID && !t.EventId ? '' : ' checked') + '><i></i>Rappel Google Agenda (notification)</label>',
    pied: (t.ID ? '<button class="btn danger gauche" id="taSuppr">' + ico('poubelle') + 'Supprimer</button>' : '') + '<button class="btn" data-fermer>Annuler</button><button class="btn principal" id="taOk">Enregistrer</button>' });
  f.el.querySelectorAll('#taType button').forEach(b => b.onclick = () => { type = b.dataset.t; f.el.querySelectorAll('#taType button').forEach(x => x.classList.toggle('actif', x === b)); });
  f.$('#taOk').onclick = () => {
    const titre = f.$('#taTitre').value.trim();
    if (!titre) return toast('Indiquez la tâche', true);
    occupe(f.$('#taOk'), appel('crmTache', { ID: t.ID, clientId: f.$('#taClient').value, type, titre, notes: f.$('#taNotes').value.trim(),
      echeance: versIso(f.$('#taDate').value, f.$('#taHeure').value), owner: f.$('#taOwner').value, rappel: f.$('#taRappel').checked }))
      .then(r => { remplacer(S.d.taches, r.tache); f.fermer(); afficher(); toast(r.avertissement || 'Tâche enregistrée', !!r.avertissement); });
  };
  if (f.$('#taSuppr')) f.$('#taSuppr').onclick = () => appel('crmSupprimerTache', t.ID).then(() => { S.d.taches = S.d.taches.filter(x => x.ID !== t.ID); f.fermer(); afficher(); toast('Tâche supprimée'); });
}

function pageTaches() {
  const aujourdhui = debutJour();
  const demain = new Date(aujourdhui.getTime() + 864e5);
  const apres = new Date(aujourdhui.getTime() + 2 * 864e5);
  const date = t => t['Échéance'] ? new Date(t['Échéance']) : null;
  const liste = S.d.taches.filter(t => (S.tachesEquipe || t.Owner === S.moi) && (S.tachesFaites || !t.Faite))
    .sort((a, b) => String(a['Échéance'] || 'z').localeCompare(String(b['Échéance'] || 'z')));
  const groupes = [
    ['En retard', t => !t.Faite && date(t) && date(t) < aujourdhui],
    ["Aujourd'hui", t => date(t) && date(t) >= aujourdhui && date(t) < demain],
    ['Demain', t => date(t) && date(t) >= demain && date(t) < apres],
    ['Plus tard', t => date(t) && date(t) >= apres],
    ['Sans date', t => !date(t)],
    ['Terminées', t => t.Faite],
  ];
  const vus = new Set();
  let n = 0;
  $('#page').innerHTML = '<div class="page"><div class="entete"><div><h1>Tâches</h1><p>' + liste.filter(t => !t.Faite).length + ' à faire</p></div>' +
    '<button class="btn principal" id="tNouv">' + ico('plus') + 'Nouvelle tâche</button></div>' +
    '<div class="rangee" style="margin-bottom:14px"><div class="segment"><button id="tMoi" class="' + (S.tachesEquipe ? '' : 'actif') + '">Mes tâches</button><button id="tEquipe" class="' + (S.tachesEquipe ? 'actif' : '') + '">Toute l’équipe</button></div>' +
    '<span class="espace"></span><label class="interrupteur petit"><input type="checkbox" id="tFaites"' + (S.tachesFaites ? ' checked' : '') + '><i></i>Afficher terminées</label></div>' +
    '<div class="carte">' + (liste.length ? groupes.map(([titre, test]) => {
      const elts = liste.filter(t => !vus.has(t.ID) && test(t));
      elts.forEach(t => vus.add(t.ID));
      return elts.length ? '<div class="groupe etiquette">' + titre + ' · ' + elts.length + '</div>' + elts.map(t => ligneTache(t, n++)).join('') : '';
    }).join('') : '<div class="vide">' + ico('taches') + '<b>Tout est à jour</b>Aucune tâche à faire.</div>') + '</div></div>';
  $('#tNouv').onclick = () => fenetreTache();
  $('#tMoi').onclick = () => { S.tachesEquipe = false; pageTaches(); };
  $('#tEquipe').onclick = () => { S.tachesEquipe = true; pageTaches(); };
  $('#tFaites').onchange = e => { S.tachesFaites = e.target.checked; pageTaches(); };
  brancherTaches();
}

function fenetreRdv(c) {
  const d = new Date(Date.now() + 864e5);
  const f = fenetre({ titre: 'Nouveau rendez-vous', corps:
    '<label class="champ"><span>Client</span>' + selectClient(c ? c.ID : '', 'rdClient') + '</label>' +
    '<label class="champ"><span>Titre</span><input type="text" id="rdTitre"></label>' +
    '<div class="grille-2"><label class="champ"><span>Date</span><input type="date" id="rdDate" value="' + dateLocale(d) + '"></label>' +

    '<label class="champ"><span>Avec</span><select id="rdOwner">' + S.d.owners.map(o => '<option' + (((c && c.Owner) || S.moi) === o ? ' selected' : '') + '>' + esc(o) + '</option>').join('') + '</select></label></div>' +
    '<label class="champ"><span>Lieu ou lien visio</span><input type="text" id="rdLieu" placeholder="À la salle, par téléphone, lien Meet…"></label>' +
    '<label class="champ"><span>Message de l’invitation</span><textarea id="rdNotes" style="min-height:70px"></textarea></label>' +
    '<label class="interrupteur"><input type="checkbox" id="rdInviter" checked><i></i><span id="rdAide"></span></label>',
    pied: '<button class="btn" data-fermer>Annuler</button><button class="btn principal" id="rdOk">' + ico('rdv') + 'Planifier</button>' });
  let titreTouche = false;
  const maj = () => {
    const x = client(f.$('#rdClient').value);
    if (!titreTouche) f.$('#rdTitre').value = 'Rendez-vous Hygiène & Combat' + (x ? ' – ' + nomClient(x) : '');
    const peut = !!(x && x.Email);
    f.$('#rdInviter').disabled = !peut;
    f.$('#rdInviter').checked = peut;
    f.$('#rdAide').textContent = peut ? 'Envoyer l’invitation à ' + x.Email : 'Pas d’e-mail : ajouté seulement à votre agenda';
  };
  f.$('#rdTitre').oninput = () => { titreTouche = true; };
  f.$('#rdClient').onchange = maj;
  maj();
  f.$('#rdOk').onclick = () => { const invitation = f.$('#rdInviter').checked; occupe(f.$('#rdOk'), appel('crmRdv', { clientId: f.$('#rdClient').value, titre: f.$('#rdTitre').value.trim() || 'Rendez-vous Hygiène & Combat',
    debut: versIso(f.$('#rdDate').value, f.$('#rdHeure').value), duree: Number(f.$('#rdDuree').value) || 30, lieu: f.$('#rdLieu').value.trim(),
    notes: f.$('#rdNotes').value.trim(), inviter: f.$('#rdInviter').checked, owner: f.$('#rdOwner').value }))
    .then(data => { S.d = data; f.fermer(); afficher(); toast(invitation ? 'Rendez-vous planifié, invitation envoyée' : 'Rendez-vous ajouté à l’agenda'); }); };
}

function pageAgenda() {
  const maintenant = new Date();
  const avenir = S.d.rdv.filter(r => new Date(r.Fin || r['Début']) >= maintenant).sort((a, b) => String(a['Début']).localeCompare(String(b['Début'])));
  const passes = S.d.rdv.filter(r => new Date(r.Fin || r['Début']) < maintenant).sort((a, b) => String(b['Début']).localeCompare(String(a['Début']))).slice(0, 10);
  const parJour = liste => {
    const jours = {};
    liste.forEach(r => { const k = new Date(r['Début']).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }); (jours[k] = jours[k] || []).push(r); });
    return Object.keys(jours).map(j => '<div class="groupe etiquette">' + esc(j) + '</div>' + jours[j].map(ligneRdv).join('')).join('');
  };
  $('#page').innerHTML = '<div class="page"><div class="entete"><div><h1>Agenda</h1><p>' + avenir.length + ' rendez-vous à venir</p></div>' +
    '<button class="btn principal" id="rNouv">' + ico('plus') + 'Nouveau rendez-vous</button></div>' +
    '<div class="carte" style="margin-bottom:16px">' + (avenir.length ? parJour(avenir) : '<div class="vide">' + ico('agenda') + '<b>Aucun rendez-vous prévu</b>Planifiez-en un depuis une fiche client.</div>') + '</div>' +
    (passes.length ? '<div class="etiquette" style="margin:22px 0 10px">Passés</div><div class="carte">' + passes.map(ligneRdv).join('') + '</div>' : '') +
    '<p class="pale petit" style="margin-top:16px">Les rendez-vous et rappels sont dans Google Agenda (contact@) : installez l’appli Google Agenda sur vos téléphones pour les notifications.</p></div>';
  $('#rNouv').onclick = () => fenetreRdv(null);
  $$('[data-ouvrir]').forEach(a => a.onclick = e => { e.preventDefault(); aller('fiche', a.dataset.ouvrir); });
  $$('[data-annuler]').forEach(b => b.onclick = () => confirmer('Annuler ce rendez-vous ?', 'Il sera supprimé de Google Agenda.', 'Annuler le RDV').then(ok => ok &&
    appel('crmAnnulerRdv', b.dataset.annuler).then(() => { S.d.rdv = S.d.rdv.filter(r => r.ID !== b.dataset.annuler); pageAgenda(); toast('Rendez-vous annulé'); })));
}
function ligneRdv(r, n) {

}

/** Les boutons {{Variable}} s'insèrent dans le dernier champ texte utilisé. */
function brancherVariables(racine) {
  let cible = null;
  racine.querySelectorAll('input[type=text], textarea').forEach(ch => ['focus', 'click', 'keyup', 'input'].forEach(ev => ch.addEventListener(ev, () => { cible = ch; })));
  racine.querySelectorAll('[data-var]').forEach(b => b.onmousedown = e => {
    e.preventDefault();
    if (!cible) return toast('Cliquez d’abord dans un champ', true);
    const v = '{{' + b.dataset.var + '}}', a = cible.selectionStart ?? cible.value.length;
    cible.value = cible.value.slice(0, a) + v + cible.value.slice(cible.selectionEnd ?? a);
    cible.selectionStart = cible.selectionEnd = a + v.length;
    cible.dispatchEvent(new Event('input'));
  });
}

// =================================================================== Import et export CSV
function lireCsv(texte) {
  texte = texte.replace(/^﻿/, '');
  const premiere = texte.split(/\r?\n/)[0] || '';
  const sep = [';', ',', '\t'].map(s => [s, premiere.split(s).length]).sort((a, b) => b[1] - a[1])[0][0];
  const lignes = [];
  let ligne = [], champ = '', guillemets = false;
  for (let i = 0; i < texte.length; i++) {
    const ch = texte[i];
    if (guillemets) {
      if (ch === '"' && texte[i + 1] === '"') { champ += '"'; i++; } else if (ch === '"') guillemets = false; else champ += ch;
    } else if (ch === '"') guillemets = true;
    else if (ch === sep) { ligne.push(champ); champ = ''; }
    else if (ch === '\n' || ch === '\r') {
      if (ch === '\r' && texte[i + 1] === '\n') i++;
      ligne.push(champ); champ = '';
      if (ligne.some(v => v.trim())) lignes.push(ligne);
      ligne = [];
    } else champ += ch;
  }
  ligne.push(champ);
  if (ligne.some(v => v.trim())) lignes.push(ligne);
  return { entetes: (lignes.shift() || []).map(h => h.trim()), lignes };
}
const SYNONYMES = {
  Salle: ['salle', 'club', 'entreprise', 'societe', 'company', 'nom de la salle', 'etablissement', 'raison sociale', 'organisation'],
  'Prénom': ['prenom', 'first name', 'firstname', 'prenom du contact'], Nom: ['nom', 'last name', 'lastname', 'nom de famille', 'nom du contact'],
  Email: ['email', 'e-mail', 'mail', 'courriel', 'adresse email', 'adresse e-mail'], 'Téléphone': ['telephone', 'tel', 'phone', 'mobile', 'portable', 'numero', 'numero de telephone'],
  Ville: ['ville', 'city', 'commune'], Adresse: ['adresse', 'address', 'adresse postale'], Discipline: ['discipline', 'sport', 'activite', 'activite sportive'],
  'Site web': ['site', 'site web', 'website', 'url', 'site internet'], Source: ['source', 'origine'], Notes: ['notes', 'note', 'commentaire', 'commentaires', 'remarques'],
  Tag: ['tag', 'statut', 'status', 'etape'], Owner: ['owner', 'responsable', 'commercial', 'contact owner'],
  'Rôle': ['role', 'fonction', 'poste', 'titre', 'qualite', 'role du contact'],
  'Téléphone 2': ['telephone 2', 'tel 2', 'phone 2', 'mobile 2', 'autre telephone', 'telephone fixe', 'fixe'], 'Email 2': ['email 2', 'e-mail 2', 'mail 2', 'autre email', 'autre e-mail'],
};
const normaliser = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[_]/g, ' ').trim();
function deviner(entete) {
  const n = normaliser(entete);
  return S.d.champs.find(c => normaliser(c) === n && !CHAMPS_NON_IMPORTABLES.includes(c)) || Object.keys(SYNONYMES).find(k => SYNONYMES[k].includes(n)) || '';
}

      pageImport();
    };
    const lecteur = new FileReader();
    lecteur.onload = () => {
      const texte = String(lecteur.result);
      if (!texte.includes('�')) return preparer(texte);
      const l2 = new FileReader(); // fichier Excel en Windows-1252
      l2.onload = () => preparer(String(l2.result));
      l2.readAsText(fichier, 'windows-1252');
    };
    lecteur.readAsText(fichier, 'utf-8');

  $$('[data-col]').forEach(s => s.onchange = () => { csv.map[Number(s.dataset.col)] = s.value; });

        if (v) o[cible] = o[cible] ? o[cible] + ' ' + v : v;
      });
      return o;
    });

      toast(r.ajoutes + ' client(s) importé(s)' + (r.doublons ? ' · ' + r.doublons + ' doublon(s) ignoré(s)' : '') + (r.vides ? ' · ' + r.vides + ' ligne(s) vide(s)' : ''));
      // Le lot importé s'affiche seul : on peut le vérifier, ou tout cocher et le supprimer d'un coup.
      return charger().then(() => { S.vue = 'tous'; S.filtres = defauts.Source ? { source: defauts.Source } : null; aller('clients'); });
    });
  };
}

function exporter(clients) {
  const colonnes = S.d.champs;
  const cellule = v => {
    let s = String(v ?? '');
    if (/^[=+\-@]/.test(s)) s = "'" + s; // évite l'exécution de formules à l'ouverture dans Excel
    return /[";\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const texte = '﻿' + [colonnes.join(';')].concat(clients.map(c => colonnes.map(k => cellule(CHAMPS_DATE.includes(k) ? fmtDate(c[k]) : c[k])).join(';'))).join('\r\n');
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([texte], { type: 'text/csv;charset=utf-8' }));
    a.download = 'clients-hygiene-combat-' + dateLocale(new Date()) + '.csv';
    document.body.appendChild(a);
    a.click();
    a.remove();
    toast(clients.length + ' client(s) exporté(s)');
  } catch (e) {
    fenetre({ titre: 'Export CSV', corps: '<p class="doux" style="margin-top:0">Copiez ce texte dans un fichier .csv :</p><textarea style="min-height:240px">' + esc(texte) + '</textarea>', pied: '<button class="btn" data-fermer>Fermer</button>' });
  }
}

/** Solde à une date passée : solde actuel moins les opérations arrivées depuis (null si avant le début de l'historique lu). */
function soldeAu(date) {
  const q = S.d.qonto || {};
  if (!q.connecte || q.solde === undefined) return null;
  if (q.historique && date < new Date(q.historique)) return null;
  return q.solde - S.d.banque.filter(b => new Date(b.Date) >= date).reduce((t, b) => t + (Number(b.Montant) || 0), 0);
}
