<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>CRM Hygiène &amp; Combat</title>
<meta name="theme-color" content="#2a3840">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CRM H&amp;C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
  /* Charte Hygiène & Combat : ardoise #2a3840 → #384a54, bleu acier #87a6bb, DM Sans */
  :root {
    --ardoise-900: #1d282e; --ardoise-800: #2a3840; --ardoise-700: #384a54; --ardoise-600: #4a5f6b;
    --acier: #87a6bb; --acier-600: #6c8ea5; --acier-100: #e6eef3; --acier-50: #f2f6f9;
    --fond: #f5f7f8; --surface: #ffffff; --texte: #121b20; --doux: #5b6a72; --pale: #8e9ba1;
    --trait: #e3e8eb; --trait-fort: #cfd8dd;
    --ok: #2f8460; --ok-50: #e7f4ee; --attention: #b7791f; --attention-50: #fbf3e4; --danger: #c2413b; --danger-50: #fbecea;
    --r-s: 8px; --r: 12px; --r-l: 16px;
    --ombre: 0 1px 2px rgba(18,27,32,.05), 0 2px 8px rgba(18,27,32,.04);
    --ombre-l: 0 12px 40px rgba(18,27,32,.18), 0 2px 8px rgba(18,27,32,.08);
    --vite: 160ms cubic-bezier(.2,.7,.3,1); --doucement: 260ms cubic-bezier(.2,.7,.3,1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--fond); color: var(--texte); -webkit-font-smoothing: antialiased;
    font: 15px/1.5 "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  /* Comme une vraie app : pas de zoom (pincement, double tap, ni zoom auto d'iPhone sur les champs de moins de 16 px) */
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; overscroll-behavior: none; background: var(--fond); }
  body { overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
  /* Pas de sélection de texte sur les boutons et menus (comme une app) */
  button, .nav, .onglets-mobile, .barre-mobile { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  @media (max-width: 959px) { input, select, textarea { font-size: 16px !important; } }
  a { color: var(--ardoise-700); text-decoration: none; }
  h1, h2, h3 { margin: 0; letter-spacing: -.01em; }
  h1 { font-size: 24px; font-weight: 700; }
  h2 { font-size: 16px; font-weight: 600; }
  .etiquette { font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--pale); }
  .doux { color: var(--doux); } .pale { color: var(--pale); } .petit { font-size: 13px; }
  svg.i { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* ---------- Structure ---------- */
  .app { display: flex; min-height: 100vh; }
  .nav { position: sticky; top: 0; height: 100vh; width: 236px; flex: none; display: none; flex-direction: column;
    background: linear-gradient(180deg, var(--ardoise-800), var(--ardoise-700)); color: #fff; padding: 22px 14px; }
  .marque { display: flex; align-items: center; gap: 10px; padding: 0 8px 26px; }
  .marque svg { width: 30px; height: 30px; stroke: #fff; fill: none; stroke-width: 1.3; }
  .marque b { display: block; font-size: 11.5px; letter-spacing: .12em; font-weight: 600; white-space: nowrap; }
  .marque span { display: block; font-size: 10.5px; letter-spacing: .2em; color: var(--acier); text-transform: uppercase; }
  .nav button { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; background: none; color: rgba(255,255,255,.72);
    padding: 10px 12px; border-radius: 10px; cursor: pointer; font-size: 14.5px; position: relative; transition: background var(--vite), color var(--vite); }
  .nav button:hover { background: rgba(255,255,255,.07); color: #fff; }
  .nav .nav-bas { margin-top: auto; padding-top: 10px; border-top: 1px solid rgba(255,255,255,.08); display: grid; gap: 2px; }
  .nav .nav-bas + .pied-nav { margin-top: 10px; }
  .nav button.actif { background: rgba(255,255,255,.12); color: #fff; font-weight: 600; }
  .nav button.actif::before { content: ""; position: absolute; left: -14px; top: 9px; bottom: 9px; width: 3px; border-radius: 0 3px 3px 0; background: var(--acier); }
  .nav .compteur { margin-left: auto; font-size: 11.5px; font-weight: 600; background: var(--acier); color: var(--ardoise-900); border-radius: 999px; padding: 0 7px; line-height: 19px; }
  .nav .pied-nav { margin-top: auto; padding: 12px; border-radius: 12px; background: rgba(255,255,255,.06); display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .nav .pied-nav small { display: block; color: rgba(255,255,255,.55); font-size: 11.5px; }
  .zone { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .barre-mobile { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 10px; padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
    background: linear-gradient(180deg, var(--ardoise-800), var(--ardoise-700)); color: #fff; }
  .barre-mobile svg.logo { width: 24px; height: 24px; stroke: #fff; fill: none; stroke-width: 1.4; }
  .barre-mobile b { font-size: 12px; letter-spacing: .16em; font-weight: 600; }
  main { width: 100%; max-width: 1360px; margin: 0 auto; padding: 18px 16px calc(76px + env(safe-area-inset-bottom)); }
  .onglets-mobile { position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; display: flex; background: rgba(255,255,255,.96);
    backdrop-filter: blur(10px); border-top: 1px solid var(--trait); padding: 6px 4px max(6px, calc(env(safe-area-inset-bottom) - 14px)); }
  .onglets-mobile button { flex: 1; border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 3px;
    font-size: 10.5px; color: var(--pale); padding: 4px 0; cursor: pointer; position: relative; transition: color var(--vite); }
  .onglets-mobile button.actif { color: var(--ardoise-700); font-weight: 600; }
  .onglets-mobile button .pastille-nb { position: absolute; top: 0; left: 52%; background: var(--danger); color: #fff; font-size: 10px; min-width: 16px; height: 16px; border-radius: 8px; line-height: 16px; padding: 0 4px; }
  @media (min-width: 960px) {
    .nav { display: flex; } .barre-mobile, .onglets-mobile { display: none; }
    main { padding: 30px 36px 48px; }
  }

  /* ---------- Éléments ---------- */
  .page { animation: entree var(--doucement) both; }
  @keyframes entree { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .entete { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  .entete p { margin: 4px 0 0; color: var(--doux); font-size: 14px; }
  .rangee { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  [hidden] { display: none !important; }
  .espace { flex: 1; }
  .carte { background: var(--surface); border: 1px solid var(--trait); border-radius: var(--r-l); box-shadow: var(--ombre); }
  .carte-corps { padding: 18px; }
  .carte-tete { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--trait); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid var(--trait-fort); background: var(--surface);
    color: var(--texte); border-radius: var(--r); padding: 8px 14px; font-weight: 500; font-size: 14px; cursor: pointer; white-space: nowrap;
    transition: background var(--vite), border-color var(--vite), transform var(--vite), box-shadow var(--vite); }
  .btn:hover { border-color: var(--acier); background: var(--acier-50); }
  .btn:active { transform: scale(.98); }
  .btn.principal { background: var(--ardoise-700); border-color: var(--ardoise-700); color: #fff; box-shadow: 0 1px 2px rgba(42,56,64,.3); }
  .btn.principal:hover { background: var(--ardoise-800); }
  .btn.acier { background: var(--acier); border-color: var(--acier); color: var(--ardoise-900); }
  .btn.fantome { border-color: transparent; background: transparent; }
  .btn.fantome:hover { background: var(--acier-50); }
  .btn.danger { color: var(--danger); }
  .btn.danger:hover { border-color: var(--danger); background: var(--danger-50); }
  .btn.mini { padding: 5px 10px; font-size: 13px; border-radius: 9px; }
  .btn.icone { padding: 7px; }
  .btn:disabled { opacity: .5; pointer-events: none; }
  .btn .chargeur { width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: tourne .7s linear infinite; }
  @keyframes tourne { to { transform: rotate(360deg); } }
  input[type=text], input[type=password], input[type=email], input[type=tel], input[type=number], input[type=date], input[type=time], input[type=search], select, textarea {
    width: 100%; border: 1px solid var(--trait-fort); border-radius: 10px; padding: 9px 12px; background: #fff; outline: none;
    transition: border-color var(--vite), box-shadow var(--vite); }
  input:focus, select:focus, textarea:focus { border-color: var(--acier); box-shadow: 0 0 0 3px rgba(135,166,187,.25); }
  textarea { resize: vertical; min-height: 90px; line-height: 1.55; }
  label.champ { display: block; margin-bottom: 14px; }
  label.champ > span { display: block; font-size: 12.5px; font-weight: 500; color: var(--doux); margin-bottom: 5px; }
  .grille-2 { display: grid; grid-template-columns: 1fr; gap: 0 14px; }
  @media (min-width: 560px) { .grille-2 { grid-template-columns: 1fr 1fr; } }
  .segment { display: inline-flex; background: var(--acier-50); border: 1px solid var(--trait); border-radius: 11px; padding: 3px; gap: 2px; }
  .segment button { border: 0; background: none; padding: 6px 12px; border-radius: 8px; font-size: 13.5px; color: var(--doux); cursor: pointer; transition: background var(--vite), color var(--vite), box-shadow var(--vite); }
  .segment button.actif { background: #fff; color: var(--texte); font-weight: 600; box-shadow: 0 1px 3px rgba(18,27,32,.12); }
  .interrupteur { position: relative; display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 500; }
  .interrupteur input { position: absolute; opacity: 0; }
  .interrupteur i { width: 40px; height: 23px; border-radius: 999px; background: var(--trait-fort); position: relative; transition: background var(--vite); }
  .interrupteur i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 17px; height: 17px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: transform var(--doucement); }
  .interrupteur input:checked + i { background: var(--ok); }
  .interrupteur input:checked + i::after { transform: translateX(17px); }
  .case { appearance: none; width: 18px; height: 18px; border: 1.6px solid var(--trait-fort); border-radius: 5px; margin: 0; cursor: pointer; display: grid; place-content: center; transition: background var(--vite), border-color var(--vite); flex: none; background: #fff; }
  .case::after { content: ""; width: 9px; height: 5px; border: 2px solid #fff; border-top: 0; border-right: 0; transform: rotate(-45deg) scale(0); transition: transform var(--vite); margin-top: -2px; }
  .case:checked { background: var(--ardoise-700); border-color: var(--ardoise-700); }
  .case:checked::after { transform: rotate(-45deg) scale(1); }
  .case.ronde { border-radius: 50%; width: 20px; height: 20px; }
  .case.ronde:checked { background: var(--ok); border-color: var(--ok); }

  .tag { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
  .tag::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .tag.New { background: #e8f0f6; color: #3f6f8f; } .tag.Unqualified { background: #eef0f1; color: #66737a; }
  .tag.Qualifying { background: #fbf3e4; color: #9a6a1c; } .tag.Qualified { background: #ecebf8; color: #5a51a8; } .tag.Won { background: var(--ok-50); color: var(--ok); } .tag.Lost { background: #f1eeee; color: #8a5a57; }
  .puce { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12.5px; background: var(--acier-50); color: var(--doux); border: 1px solid var(--trait); white-space: nowrap; }
  .puce svg.i { width: 14px; height: 14px; }
  .puce.vert { background: var(--ok-50); color: var(--ok); border-color: transparent; }
  .puce.orange { background: var(--attention-50); color: var(--attention); border-color: transparent; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 12px; font-weight: 700; color: #fff; flex: none;
    background: linear-gradient(135deg, var(--ardoise-700), var(--acier)); letter-spacing: .02em; }
  .avatar.s { width: 24px; height: 24px; font-size: 10px; }
  .avatar.l { width: 60px; height: 60px; font-size: 20px; border-radius: 18px; }
  .vide { text-align: center; padding: 42px 16px; color: var(--doux); }
  .vide svg.i { width: 34px; height: 34px; stroke: var(--acier); margin-bottom: 10px; stroke-width: 1.4; }
  .vide b { display: block; color: var(--texte); font-size: 15px; margin-bottom: 4px; }

  /* ---------- Liste clients ---------- */
  .outils { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .recherche { position: relative; flex: 1; min-width: 200px; }
  .recherche svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--pale); }
  .recherche input { padding-left: 38px; background: var(--surface); }
  .vues { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 12px; scrollbar-width: none; }
  .vues::-webkit-scrollbar { display: none; }
  .vues button { flex: none; display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--trait); background: var(--surface); border-radius: 999px;
    padding: 6px 13px; font-size: 13.5px; color: var(--doux); cursor: pointer; transition: all var(--vite); }
  .vues button:hover { border-color: var(--acier); color: var(--texte); }
  .vues button b { font-weight: 600; color: var(--pale); font-size: 12px; }
  .vues button.actif { background: var(--ardoise-700); border-color: var(--ardoise-700); color: #fff; }
  .vues button.actif b { color: var(--acier); }
  .tableau { overflow: hidden; }
  .ligne { display: grid; grid-template-columns: 22px minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--trait);
    cursor: pointer; transition: background var(--vite); animation: entree var(--doucement) both; animation-delay: calc(var(--n, 0) * 14ms); }
  .ligne:last-child { border-bottom: 0; }
  .ligne:hover { background: var(--acier-50); }
  .ligne.choisie { background: #eef3f7; }
  .ligne .qui { display: flex; align-items: center; gap: 11px; min-width: 0; }
  .ligne .qui div { min-width: 0; }
  .ligne .nom { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ligne .sous { font-size: 13px; color: var(--doux); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ligne .col { display: none; font-size: 13.5px; color: var(--doux); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ligne.tete { display: none; cursor: default; background: var(--acier-50); padding-top: 10px; padding-bottom: 10px; animation: none; }
  @media (min-width: 1100px) {
    .ligne { grid-template-columns: 22px minmax(220px, 2.2fr) 120px 150px 110px 120px minmax(120px, 1.3fr); }
    .ligne .col { display: block; } .ligne .mobile { display: none; } .ligne.tete { display: grid; }
  }
  .barre-actions { position: fixed; left: 50%; bottom: 84px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; z-index: 40;
    display: flex; align-items: center; gap: 8px; padding: 9px 10px 9px 16px; background: var(--ardoise-800); color: #fff; border-radius: 14px; box-shadow: var(--ombre-l);
    transition: transform var(--doucement), opacity var(--doucement); max-width: calc(100vw - 24px); overflow-x: auto; }
  .barre-actions.visible { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
  .barre-actions .btn { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.14); color: #fff; }
  .barre-actions .btn:hover { background: rgba(255,255,255,.16); }
  .barre-actions select { width: auto; background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.14); color: #fff; padding: 6px 10px; font-size: 13px; }
  .barre-actions select option { color: var(--texte); }
  @media (min-width: 960px) { .barre-actions { bottom: 26px; margin-left: 118px; } }
  .filtres { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 18px; padding: 18px; }
  .filtres-zone { overflow: hidden; animation: deplie var(--doucement) both; margin-bottom: 14px; }
  @keyframes deplie { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  .options { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .options label { display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; padding: 5px 10px; border: 1px solid var(--trait); border-radius: 9px; cursor: pointer; background: #fff; }

  /* ---------- Fiche client ---------- */
  .fil { display: flex; align-items: center; gap: 6px; color: var(--doux); font-size: 14px; margin-bottom: 16px; }
  .fil a { display: inline-flex; align-items: center; gap: 4px; color: var(--doux); }
  .fil a:hover { color: var(--texte); }
  .fiche { display: grid; gap: 16px; grid-template-columns: minmax(0,1fr); align-items: start; }
  .fiche-onglets { margin-bottom: 14px; }
  .fiche > section { display: none; flex-direction: column; gap: 16px; min-width: 0; }
  /* Mise à jour en temps réel : pas d'animation d'apparition (l'écran ne « clignote » pas) */
  .sans-anim #page * { animation: none !important; }
  /* Téléphone : historique plus compact, les filtres défilent sur une ligne */
  @media (max-width: 600px) {
    .chronologie { padding: 4px 12px 14px; }
    .chronologie li { grid-template-columns: 28px minmax(0,1fr); gap: 10px; padding: 10px 0; }
    .chronologie li.conv-nous { grid-template-columns: minmax(0,1fr) 28px; }
    .chronologie li:not(:last-child)::before { left: 13px; top: 40px; }
    .chronologie li.conv-nous:not(:last-child)::before { right: 13px; }
    .chronologie .bulle { width: 28px; height: 28px; } .chronologie .bulle svg { width: 14px; height: 14px; }
    .chronologie .titre-act { font-size: 13.5px; }
    .chronologie .texte-act { font-size: 13.5px; padding: 8px 10px; overflow-wrap: anywhere; }
    .chronologie li.conv-nous .texte-act, .chronologie li.conv-client .texte-act { max-width: 100%; }
    .chronologie .meta { font-size: 12px; }
  }
  .fiche > section.visible { display: flex; }
  @media (min-width: 1100px) {
    .fiche { grid-template-columns: 340px minmax(0,1fr); }
    .fiche > section { display: flex !important; }
    .fiche > .col-droite { grid-column: 2; }
    .fiche-onglets { display: none; }
  }
  @media (min-width: 1360px) { .fiche { grid-template-columns: 340px minmax(0,1fr) 320px; } .fiche > .col-droite { grid-column: 3; grid-row: 1; } }
  .profil { padding: 22px 20px 18px; }
  .profil .titre-edit { width: 100%; font-size: 21px; font-weight: 700; letter-spacing: -.01em; border: 1px solid transparent; border-radius: 8px; padding: 2px 6px; margin: 12px 0 0 -6px; background: transparent; }
  .profil .titre-edit:hover { border-color: var(--trait); }
  .profil .titre-edit:focus { border-color: var(--acier); background: #fff; }
  .faits { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 16px; }
  .choix-tag { display: flex; flex-wrap: wrap; gap: 6px; }
  .choix-tag button { border: 1px solid var(--trait); background: #fff; border-radius: 999px; padding: 4px 11px; font-size: 12.5px; font-weight: 500; color: var(--doux); cursor: pointer; transition: all var(--vite); }
  .choix-tag button:hover { border-color: var(--acier); }
  .choix-tag button.actif { border-color: transparent; }
  .owner-ligne { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
  .owner-ligne select { width: auto; flex: 1; padding: 6px 10px; }
  .actions-fiche { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 18px; }
  @media (min-width: 560px) and (max-width: 1099px) { .actions-fiche { grid-template-columns: repeat(7, 1fr); } }
  .bulle.Comparatif { background: #e6eef3; color: var(--ardoise-700); border-color: transparent; }
  .comparateur-plein { position: fixed; inset: 0; z-index: 70; display: flex; flex-direction: column; background: var(--fond); animation: entree var(--doucement) both; }
  .comparateur-plein header { display: flex; align-items: center; gap: 12px; padding: calc(10px + env(safe-area-inset-top)) 14px 10px; background: linear-gradient(180deg, var(--ardoise-800), var(--ardoise-700)); color: #fff; }
  .comparateur-plein header b { font-size: 14px; } .comparateur-plein header span { color: var(--acier); font-size: 12.5px; }
  .comparateur-plein header .btn { margin-left: auto; background: rgba(255,255,255,.12); color: #fff; border-color: transparent; }
  .comparateur-plein iframe { flex: 1; width: 100%; border: 0; background: #fff; }

/**
 * Appel au serveur (API Apps Script, une requête « simple » sans pré-vérification CORS).
 * Session expirée → écran de connexion ; mot de passe encore provisoire → choix du mot de passe.
 */
function rpc(fn, args) {
  return fetch(API, { method: 'POST', body: JSON.stringify({ fn, args, jeton: S.jeton || '' }) })
    .then(r => { if (!r.ok) throw new Error('Le serveur ne répond pas (' + r.status + '). Réessayez.'); return r.json(); },
      () => { throw new Error(navigator.onLine === false ? 'Pas de connexion internet.' : 'Connexion au serveur impossible. Réessayez.'); })
    .then(rep => {
      if (rep.ok) return rep.r;
      if (rep.erreur === 'SESSION_EXPIREE') { if (fn !== 'crmConnexion') sessionPerdue(); throw new Error('Session expirée : reconnectez-vous.'); }
      if (rep.erreur === 'MDP_A_CHANGER') { ecranNouveauMdp(); throw new Error('Choisissez d’abord votre mot de passe.'); }
      throw new Error(rep.erreur);
    });
}
function appel(fn, ...args) {
  return rpc(fn, args).catch(e => { toast(e.message, true); throw e; });
}
const appelDiscret = (fn, ...args) => rpc(fn, args);

/** Données gardées sur l'appareil (IndexedDB) : l'application s'ouvre instantanément, puis se met à jour. */
const memoire = {
  base: null,
  ouvrir() {
    return this.base || (this.base = new Promise((ok, ko) => {
      const r = indexedDB.open('crm-hc', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => ok(r.result);
      r.onerror = () => ko(r.error);
    }));
  },
  lire(cle) {
    return this.ouvrir().then(db => new Promise(ok => { const q = db.transaction('kv').objectStore('kv').get(cle); q.onsuccess = () => ok(q.result); q.onerror = () => ok(undefined); })).catch(() => undefined);
  },
  ecrire(cle, v) {
    return this.ouvrir().then(db => new Promise(ok => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, cle); t.oncomplete = t.onerror = () => ok(); })).catch(() => {});
  },
};
let minuterieMemoire = null;
function memoriser() {
  clearTimeout(minuterieMemoire);
  minuterieMemoire = setTimeout(() => { if (S.d && S.jeton) memoire.ecrire('donnees', { moi: S.moi, d: S.d }); }, 800);
}

function toast(msg, erreur) {
  const t = document.createElement('div');
  t.className = 'toast' + (erreur ? ' err' : '');
  t.innerHTML = ico(erreur ? 'alerte' : 'ok') + '<span>' + esc(msg) + '</span>';
  $('#toasts').appendChild(t);
  setTimeout(() => { t.classList.add('sortie'); setTimeout(() => t.remove(), 200); }, erreur ? 6000 : 2600);
}

/** Bouton qui affiche un chargeur pendant l'appel serveur. */
function occupe(bouton, promesse) {
  if (!bouton) return promesse;
  const html = bouton.innerHTML;
  bouton.disabled = true;
  bouton.innerHTML = '<i class="chargeur"></i>' + bouton.textContent.trim();
  return promesse.finally(() => { if (bouton.isConnected) { bouton.disabled = false; bouton.innerHTML = html; } });
}

const fmtDate = iso => iso ? new Date(iso).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
const fmtHeure = iso => iso ? new Date(iso).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }) : '';
const fmtJourHeure = iso => iso ? new Date(iso).toLocaleString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
const joursDepuis = iso => iso ? Math.floor((Date.now() - new Date(iso).getTime()) / 864e5) : null;
function ilYa(iso) {
  const j = joursDepuis(iso);
  if (j === null) return 'jamais';
  if (j <= 0) return "aujourd'hui";
  return j === 1 ? 'hier' : 'il y a ' + j + ' j';
}
function relatif(iso) {
  if (!iso) return '';
  const d = new Date(iso), maintenant = new Date();
  const jours = Math.round((debutJour(d) - debutJour(maintenant)) / 864e5);
  if (jours === 0) return "aujourd'hui " + fmtHeure(iso);
  if (jours === 1) return 'demain ' + fmtHeure(iso);
  if (jours === -1) return 'hier ' + fmtHeure(iso);
  return fmtJourHeure(iso);
}
const debutJour = (d = new Date()) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const p2 = n => String(n).padStart(2, '0');
const dateLocale = d => d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate());
const heureLocale = d => p2(d.getHours()) + ':' + p2(d.getMinutes());
function versIso(date, heure) {
  if (!date) return '';
  const [a, m, j] = date.split('-').map(Number);
  const [h, mi] = (heure || '09:00').split(':').map(Number);
  return new Date(a, m - 1, j, h, mi).toISOString();
}

const telNettoye = t => String(t || '').replace(/[^\d+]/g, '');
function remplacer(liste, objet) { const i = liste.findIndex(x => x.ID === objet.ID); if (i >= 0) liste[i] = objet; else liste.push(objet); }
/** Client renvoyé par le serveur, avec éventuellement la commande, la tâche et l'activité créées en même temps. */
function majClient(c) {
  if (c.__commande || c.Tag === 'Lost') fermerRachats(c.ID, c.__tache && c.__tache.ID); // le serveur a clos les anciennes tâches de rachat

}
/** Dernier clic d'un client sur un lien de nos e-mails (date ISO), calculé une fois par chargement des activités. */
function dernierClic(clientId) {
  if (!S.clics || S.clics.source !== S.d.activites || S.clics.n !== S.d.activites.length) {

/** Doublons : même numéro (9 derniers chiffres, 06… = +33 6…) ou même e-mail, sur les deux numéros / e-mails. */
const cleTel = v => String(v || '').replace(/\D/g, '').slice(-9);
function indexDoublons() {
  if (S.doublons && Date.now() - S.doublons.t < 80 && S.doublons.n === S.d.clients.length) return S.doublons;
  const parCle = {};
  S.d.clients.forEach(c => {
    const cles = new Set([cleTel(c['Téléphone']), cleTel(c['Téléphone 2'])].filter(k => k.length === 9).map(k => 't' + k)
      .concat([c.Email, c['Email 2']].map(e => String(e || '').trim().toLowerCase()).filter(e => e.includes('@')).map(e => 'e' + e)));
    cles.forEach(k => (parCle[k] = parCle[k] || []).push(c.ID));
  });
  S.doublons = { t: Date.now(), n: S.d.clients.length, parCle };
  return S.doublons;
}
/** Autres fiches qui partagent un numéro ou un e-mail avec `c` : [{ client, raison }]. */
function doublonsDe(c) {
  const { parCle } = indexDoublons(), vus = {};
  [cleTel(c['Téléphone']), cleTel(c['Téléphone 2'])].filter(k => k.length === 9).forEach(k => (parCle['t' + k] || []).forEach(id => { if (id !== c.ID) vus[id] = vus[id] || 'même numéro'; }));
  [c.Email, c['Email 2']].map(e => String(e || '').trim().toLowerCase()).filter(e => e.includes('@')).forEach(e => (parCle['e' + e] || []).forEach(id => { if (id !== c.ID) vus[id] = vus[id] || 'même e-mail'; }));
  return Object.keys(vus).map(id => ({ client: client(id), raison: vus[id] })).filter(x => x.client);
}
const fermerRachats = (clientId, sauf) => S.d.taches.forEach(t => { if (t.ClientID === clientId && !t.Faite && t.ID !== sauf && /^Rachat ·/.test(t.Titre)) t.Faite = true; });
const inscriptionActive = clientId => S.d.inscriptions.find(i => i.ClientID === clientId && i.Statut === 'En cours');

/** Même règle que le serveur : {{Champ}} remplacé, variable vide supprimée avec l'espace qui la précède. */
function rendre(modele, vars) {
  return String(modele ?? '').replace(/( ?)\{\{\s*([^}]+?)\s*\}\}/g, (tout, espace, nom) => {
    if (/^comparatif pdf$/i.test(nom)) return tout; // remplacé par la pièce jointe au moment de l'envoi
    const v = String(vars[nom] ?? '').trim();
    if (!v && /^lien rdv$/i.test(nom)) return tout; // lien pas encore réglé : on le garde visible (l'envoi le signale)
    return v ? espace + v : '';
  }).replace(/\n{3,}/g, '\n\n').trim();
}
const variables = (c, owner) => Object.assign({}, c, { Owner: owner || c.Owner || '', Responsable: owner || c.Owner || '', Entreprise: c.Salle, 'Lien RDV': (S.d.reglages || {}).LIEN_RDV || '' });

/** Ouverture : données de l'appareil affichées tout de suite (pas d'attente du serveur), puis mise à jour en arrière-plan. */
function lancerCRM() {
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
  document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
  enregistrerServiceWorker();
  surveillerReseau();
  const jeton = lire('crm_session', '');
  if (!jeton) return ecranConnexion();
  S.jeton = jeton;
  memoire.lire('donnees').then(m => {
    if (m && m.d && m.moi) {
      S.d = m.d;
      S.moi = m.moi;
      document.body.classList.remove('deconnecte');
      afficher();
      surveiller();
      verifierFraicheur(true);
      return;
    }
    return appelDiscret('crmSession', jeton).then(ouvrirSession);
  }).catch(e => { if (S.jeton && !/mot de passe/.test(e.message)) ecranConnexion(e.message); });
}

function ouvrirSession(r) {
  S.jeton = r.jeton;
  S.moi = r.moi;
  garder('crm_session', r.jeton);
  if (r.doitChanger || !r.data) return ecranNouveauMdp();
  S.mdpSaisi = '';
  S.d = r.data;
  document.body.classList.remove('deconnecte');
  afficher();
  surveiller();
}

function sessionPerdue() {
  garder('crm_session', '');
  memoire.ecrire('donnees', null);
  S.d = null; S.jeton = ''; S.moi = '';
  fermerFenetres();
  ecranConnexion('Session expirée : reconnectez-vous.');
}
const fermerFenetres = () => $$('#couche .voile').forEach(v => v.remove());

/**
 * Temps réel : une requête reste ouverte en permanence vers le serveur, qui répond dès qu'un changement est enregistré
 * (autre appareil, autre utilisateur, réponse d'un client, banque…) avec seulement les fiches modifiées.
 * L'écran se met à jour en 1 à 2 s, sans perdre ce que vous êtes en train d'écrire.
 */
const TABLES_APP = { Clients: 'clients', 'Activités': 'activites', 'Tâches': 'taches', RDV: 'rdv', Vues: 'vues', 'Séquences': 'sequences',
  'Modèles': 'modeles', Inscriptions: 'inscriptions', Commandes: 'commandes', Achats: 'achats', Banque: 'banque', Comparatifs: 'comparatifs' };
function surveiller() {
  if (S.surveillance) return;
  S.surveillance = true;
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { ecouter(); majApp(); } });
  window.addEventListener('focus', ecouter);
  window.addEventListener('pageshow', ecouter);
  document.addEventListener('focusout', () => setTimeout(() => { if (S.enAttente) appliquerDonnees(S.enAttente); else if (S.aRedessiner) redessiner(); }, 60));
  setInterval(ecouter, 5000); // filet de sécurité : relance l'écoute si le téléphone l'a coupée
  ecouter();
}
function ecouter() {
  if (!S.d || !S.jeton || document.hidden) return;
  if (S.ecoute && Date.now() - S.ecoute < 40000) return; // une écoute est déjà en cours
  const depuis = S.ecoute = Date.now();
  const base = S.d.version;
  appelDiscret('crmAttendre', base)
    .then(r => { recevoir(r, base); return 0; }, () => 3000)
    .then(pause => { if (S.ecoute !== depuis) return; S.ecoute = 0; setTimeout(ecouter, pause); });
}
function verifierFraicheur(force) {
  if (!S.d || !S.jeton || document.hidden || S.verifEnCours) return;
  S.verifEnCours = true;
  const base = S.d.version;
  appelDiscret('crmSync', force ? '' : base)
    .then(r => recevoir(r, force ? undefined : base))
    .catch(() => {})
    .finally(() => { S.verifEnCours = false; });
}
/** Applique une réponse du serveur : toutes les données, ou seulement les fiches modifiées. */
function recevoir(r, base) {
  if (!r || !S.d) return;
  if (r.data) return appliquerDonnees(r.data);
  if (!r.changements || (base !== undefined && String(base) !== String(S.d.version))) return; // réponse dépassée : la suivante rattrape
  r.changements.forEach(c => {
    const liste = S.d[TABLES_APP[c.t]];
    if (!liste) return;
    const i = liste.findIndex(x => x.ID === c.id);
    if (!c.l) { if (i >= 0) liste.splice(i, 1); } else if (i >= 0) liste[i] = c.l; else liste.push(c.l);
  });
  S.d.version = r.version;
  redessiner();
}
/** Saisie en cours dans la page (hors recherche) : on attend la fin de la saisie pour redessiner. */
function saisieEnCours() {
  const actif = document.activeElement;
  if (actif && actif.id !== 'recherche' && $('#page').contains(actif) && /^(INPUT|TEXTAREA|SELECT)$/.test(actif.tagName)) return true;
  return $$('#page textarea, #page input:not([type=checkbox]):not([type=radio]):not([type=search])').some(el => el.value !== el.defaultValue);
}
function appliquerDonnees(d) {
  if (saisieEnCours()) { S.enAttente = d; return; }
  S.enAttente = null;
  S.d = d;
  redessiner();
}
function redessiner() {
  if (saisieEnCours()) { S.aRedessiner = true; return; }
  S.aRedessiner = false;
  document.body.classList.add('sans-anim');
  const recherche = document.activeElement && document.activeElement.id === 'recherche' ? [$('#recherche').selectionStart, $('#recherche').selectionEnd] : null;
  const y = window.scrollY;
  afficher();
  window.scrollTo(0, y);
  if (recherche && $('#recherche')) { $('#recherche').focus({ preventScroll: true }); try { $('#recherche').setSelectionRange(recherche[0], recherche[1]); } catch (e) { /* champ sans curseur */ } }
}

/** Pastille « Hors ligne » : l'application reste consultable avec les données de l'appareil. */
function surveillerReseau() {
  const maj = () => {
    let p = $('#horsLigne');
    if (navigator.onLine) { if (p) p.remove(); verifierFraicheur(true); return; }
    if (!p) { p = document.createElement('div'); p.id = 'horsLigne'; p.className = 'hors-ligne'; p.textContent = 'Hors ligne'; document.body.appendChild(p); }
  };
  window.addEventListener('online', maj);
  window.addEventListener('offline', maj);
  if (!navigator.onLine) maj();
}

/** Application installable : fichiers gardés hors ligne, mise à jour automatique dès qu'une nouvelle version est publiée. */
function enregistrerServiceWorker() {
  if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
  const dejaControle = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').then(reg => { S.sw = reg; setInterval(majApp, 30 * 60e3); }).catch(() => {});
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (dejaControle) nouvelleVersion(); });
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); S.installation = e; if (S.page === 'reglages' && S.d) pageReglages(); });
}
const majApp = () => { if (S.sw) S.sw.update().catch(() => {}); };
function nouvelleVersion() {
  if (!document.querySelector('#couche .voile') && !saisieEnCours()) return location.reload();
  if ($('#bandeauMaj')) return;
  const b = document.createElement('div');
  b.id = 'bandeauMaj';
  b.className = 'bandeau-app';
  b.innerHTML = '<span>Nouvelle version de l’application</span><button class="btn mini">Mettre à jour</button>';
  b.querySelector('button').onclick = () => location.reload();
  document.body.appendChild(b);
}

    (message ? '<p class="cx-erreur">' + esc(message) + '</p>' : '') +
    (actuel ? '<label class="champ"><span>Mot de passe provisoire</span><input type="password" id="nmAncien" autocomplete="current-password"></label>' : '') +
    '<input type="text" autocomplete="username" value="' + esc(S.moi) + '" hidden>' +
    '<label class="champ"><span>Nouveau mot de passe (8 caractères min.)</span><input type="password" id="nmMdp" autocomplete="new-password" minlength="8"></label>' +
    '<label class="champ"><span>Confirmer</span><input type="password" id="nmMdp2" autocomplete="new-password"></label>' +
    '<button class="btn principal" id="nmOk" type="submit">' + ico('cadenas') + 'Enregistrer et ouvrir le CRM</button>' +
    '<p class="pale petit" style="margin:14px 0 0"><a href="#" id="nmSortir">Changer d’utilisateur</a></p></form></div>';

  $('#nmForm').onsubmit = e => {

      .then(ouvrirSession)
      .catch(err => { if (/provisoire|actuel/i.test(err.message)) S.mdpSaisi = ''; ecranNouveauMdp(err.message); });
  };
}

// =================================================================== Fenêtres modales
function fenetre({ titre, corps, pied, large, fermable = true }) {
  const voile = document.createElement('div');
  voile.className = 'voile';
  voile.innerHTML = '<div class="fenetre' + (large ? ' large' : '') + '" role="dialog" aria-modal="true"><header><h2>' + titre + '</h2>' +
    (fermable ? '<button class="btn fantome icone" data-fermer aria-label="Fermer">' + ico('croix') + '</button>' : '') + '</header>' +
    '<div class="defile">' + corps + '</div>' + (pied ? '<footer>' + pied + '</footer>' : '') + '</div>';
  $('#couche').appendChild(voile);
  const fermer = () => { voile.classList.add('ferme'); setTimeout(() => voile.remove(), 150); };
  voile.querySelectorAll('[data-fermer]').forEach(b => b.onclick = fermer);
  if (fermable) voile.addEventListener('mousedown', e => { if (e.target === voile) fermer(); });
  const premier = voile.querySelector('input:not([type=checkbox]):not([type=hidden]), textarea');
  if (premier && window.innerWidth >= 700) setTimeout(() => premier.focus(), 60);
  return { el: voile, fermer, $: s => voile.querySelector(s) };
}

function confirmer(titre, texte, libelle) {
  return new Promise(ok => {
    const f = fenetre({ titre, corps: '<div class="doux">' + texte + '</div>',
      pied: '<button class="btn" data-fermer>Annuler</button><button class="btn principal" id="cfOk">' + esc(libelle || 'Confirmer') + '</button>' });
    f.$('#cfOk').onclick = () => { f.fermer(); ok(true); };
    f.el.querySelectorAll('[data-fermer]').forEach(b => b.addEventListener('click', () => ok(false)));
  });
}

function demanderTexte(titre, libelle, placeholder) {
  return new Promise(ok => {
    const f = fenetre({ titre, corps: '<label class="champ"><span>' + esc(libelle) + '</span><input type="text" id="dtVal" placeholder="' + esc(placeholder || '') + '"></label>',
      pied: '<button class="btn" data-fermer>Annuler</button><button class="btn principal" id="dtOk">Valider</button>' });
    const valider = () => { const v = f.$('#dtVal').value.trim(); if (!v) return; f.fermer(); ok(v); };
    f.$('#dtOk').onclick = valider;
    f.$('#dtVal').onkeydown = e => { if (e.key === 'Enter') valider(); };
  });
}
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  const v = [...$$('#couche .voile')].pop();
  if (v && v.querySelector('[data-fermer]')) v.querySelector('[data-fermer]').click();
});

// =================================================================== Vues et filtres
function toutesVues() {
  return VUES_BASE.concat(S.d.vues.map(v => {
    let f = {};
    try { f = typeof v.Filtres === 'string' ? JSON.parse(v.Filtres || '{}') : v.Filtres || {}; } catch (e) { /* vue illisible : affichée sans filtre */ }
    return { ID: v.ID, Nom: v.Nom, f, perso: true };
  }));
}
const filtresCourants = () => S.filtres || (toutesVues().find(v => v.ID === S.vue) || VUES_BASE[0]).f;

function correspond(c, f, q) {
  if (f.tags && f.tags.length && !f.tags.includes(c.Tag)) return false;
  if (f.exclureTags && f.exclureTags.includes(c.Tag)) return false;
  if (f.owner === '@aucun' ? c.Owner : f.owner && c.Owner !== (f.owner === '@moi' ? S.moi : f.owner)) return false;
  if (f.clicDepuis && !(dernierClic(c.ID) && joursDepuis(dernierClic(c.ID)) < Number(f.clicDepuis))) return false;
  if (f.doublons && !doublonsDe(c).length) return false;
  if (f.source && (c.Source || '') !== f.source) return false;
  if (f.rachatDu && !(c['Date rachat'] && new Date(c['Date rachat']) <= new Date(Date.now() + 7 * 864e5))) return false;
  if (f.devis && f.devis.length && !f.devis.includes(c.Devis || 'Aucun')) return false;
  if (f.sequence && f.sequence.length && !f.sequence.includes(c['Séquence'] || 'Aucune')) return false;
  if (f.jamaisAppele && c['Dernier appel']) return false;
  if (f.pasAppeleDepuis) { const j = joursDepuis(c['Dernier appel']); if (j !== null && j < Number(f.pasAppeleDepuis)) return false; }
  if (f.ville && !String(c.Ville || '').toLowerCase().includes(f.ville.toLowerCase())) return false;
  if (f.discipline && !String(c.Discipline || '').toLowerCase().includes(f.discipline.toLowerCase())) return false;
  if (q) {
    const texte = ['Salle', 'Prénom', 'Nom', 'Email', 'Email 2', 'Téléphone', 'Téléphone 2', 'Ville', 'Discipline', 'Notes'].map(k => c[k]).join(' ').toLowerCase();
    if (!q.toLowerCase().split(/\s+/).every(m => texte.includes(m))) return false;
  }
  return true;
}
const clientsFiltres = () => S.d.clients.filter(c => correspond(c, filtresCourants(), S.recherche))
  .sort((a, b) => String(b['Créé le']).localeCompare(String(a['Créé le'])));
const nbFiltres = f => Object.keys(f || {}).filter(k => k !== 'exclureTags').length;

    '<div><div class="etiquette">Séquence</div>' + cases('sequence', ['Aucune', 'En séquence', 'Répondu', 'Sans réponse', 'Arrêtée', 'À vérifier'], f.sequence) + '</div>' +
    '<div><div class="etiquette">Appels</div><div class="options"><label><input type="checkbox" class="case" id="fJamais"' + (f.jamaisAppele ? ' checked' : '') + '>Jamais appelé</label></div>' +

      '<button class="btn principal" id="fAppliquer">Appliquer</button></div></div>';
  const lireFiltres = () => {
    const valeurs = nom => [...z.querySelectorAll('input[name="' + nom + '"]:checked')].map(i => i.value);
    const r = { tags: valeurs('tags'), devis: valeurs('devis'), sequence: valeurs('sequence'), owner: $('#fOwner').value, jamaisAppele: $('#fJamais').checked,

    const parSource = {};
    choisis.forEach(c => { const k = c.Source || 'Sans source'; parSource[k] = (parSource[k] || 0) + 1; });
    const detail = '<div class="detail-suppr">' + Object.keys(parSource).sort((a, b) => parSource[b] - parSource[a]).map(k => '<div><span>' + esc(k) + '</span><b>' + parSource[k] + '</b></div>').join('') + '</div>' +
      '<p class="pale petit" style="margin:8px 0 0">Ex. : ' + choisis.slice(0, 4).map(c => esc(nomClient(c))).join(', ') + (choisis.length > 4 ? '…' : '') + '</p>' +
      (horsVue ? '<p class="cx-erreur" style="margin:10px 0 0">' + horsVue + ' fiche(s) sélectionnée(s) ne sont pas dans la liste affichée.</p>' : '');
    confirmer('Supprimer ' + ids.length + ' fiche' + (ids.length > 1 ? 's' : '') + ' ?', 'Répartition par source :' + detail + '<p style="margin:10px 0 0">Vous pourrez annuler juste après.</p>', 'Supprimer ' + ids.length)
      .then(ok => ok && occupe($('#sSuppr'), appel('crmSupprimerClients', ids)).then(r => {
        const set = new Set(ids);
        S.d.clients = S.d.clients.filter(c => !set.has(c.ID));
        S.selection.clear();
        S.annulation = r;
        pageClients();
        toast(r.n + ' fiche(s) supprimée(s)');
      }));
  };
}

function modifierEnMasse(changes) {
  const ids = [...S.selection];
  appel('crmEnregistrerClients', ids, changes).then(liste => {
    liste.forEach(majClient);
    toast(ids.length + ' client(s) mis à jour' + (changes.Tag === 'Won' ? ' · commandes créées' : ''));
    S.selection.clear();
    pageClients();
  });
}

function fenetreNouveauClient() {
  const f = fenetre({ titre: 'Nouveau client', corps: '<div class="grille-2">' +
    [['Salle', 'text'], ['Ville', 'text'], ['Prénom', 'text'], ['Nom', 'text'], ['Rôle', 'text'], ['Téléphone', 'tel'], ['Email', 'email']].map(([k, t]) =>
      '<label class="champ"><span>' + k + '</span><input type="' + t + '" data-k="' + k + '"></label>').join('') +
    '<label class="champ"><span>Owner</span><select data-k="Owner">' + S.d.owners.map(o => '<option' + (o === S.moi ? ' selected' : '') + '>' + esc(o) + '</option>').join('') + '</select></label>' +
    '<label class="champ"><span>Tag</span><select data-k="Tag">' + S.d.tags.map(t => '<option>' + t + '</option>').join('') + '</select></label></div><div id="ncDoublon"></div>',
    pied: '<button class="btn" data-fermer>Annuler</button><button class="btn principal" id="ncOk">Créer la fiche</button>' });
  f.$('#ncOk').onclick = () => {
    const ch = {};
    f.el.querySelectorAll('[data-k]').forEach(i => { ch[i.dataset.k] = i.value.trim(); });
