// =================================================================== Modèle : objectifs, rachats, churn, stock
const R = k => Number(S.d.reglages[k]) || 0;
const plusMois = (d, n) => new Date(d.getFullYear(), d.getMonth() + n, 1);
const nomMois = d => d.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
const estOuvre = d => d.getDay() % 6 !== 0;
function joursOuvres(de, a) { // jours ouvrés dans [de, a[
  let n = 0;
  for (let d = debutJour(de); d < a; d.setDate(d.getDate() + 1)) if (estOuvre(d)) n++;
  return n;
}
function ajouterJoursOuvres(d, n) {
  const x = new Date(d);
  while (n > 0) { x.setDate(x.getDate() + 1); if (estOuvre(x)) n--; }
  return x;
}
function moisDebut() {
  const [a, m] = String(S.d.reglages.DEBUT_OBJECTIFS || '2026-11').split('-').map(Number);
  return new Date(a || 2026, (m || 11) - 1, 1);
}
const indexMois = d => (d.getFullYear() - moisDebut().getFullYear()) * 12 + d.getMonth() - moisDebut().getMonth();

/** Prix de revient d'un bidon et marge d'une vente. */
function economie() {
  const B = R('BIDONS_PAR_COMMANDE') || 4, prix = R('PRIX_BIDON_HT'), parPalette = R('BIDONS_PAR_PALETTE') || 128;
  const cout1 = (R('PRIX_PALETTE_HT') + R('LIVRAISON_PALETTE_HT')) / parPalette; // commande d'une palette
  const cout3 = R('PRIX_PALETTE_HT') * (1 - R('REMISE_3_PALETTES') / 100) / parPalette; // par 3 : remise, livraison offerte
  const recus = S.d.achats.filter(a => Number(a.Bidons) > 0);
  const coutReel = recus.length ? recus.reduce((t, a) => t + (Number(a['Montant HT']) || 0) + (Number(a['Livraison HT']) || 0), 0) / recus.reduce((t, a) => t + Number(a.Bidons), 0) : cout1;
  const margeEnvoi = R('LIVRAISON_CLIENT_HT') - R('COUT_ENVOI_HT');
  return { B, prix, parPalette, cout1, cout3, coutReel, margeEnvoi, netVente: cout => B * (prix - cout) + margeEnvoi };
}

/** Churn mesuré : à chaque date de rachat, le client recommande (rachat) ou part (Lost avec au moins une commande). */
function churnReel() {
  const clientsCmd = new Set(S.d.commandes.map(x => x.ClientID));
  const perdus = S.d.clients.filter(c => c.Tag === 'Lost' && clientsCmd.has(c.ID)).length;
  const rachats = S.d.commandes.filter(x => x.Type === 'Rachat').length;
  const echeances = perdus + rachats, f = R('COMMANDES_PAR_AN') || 2.5;
  return { perdus, rachats, echeances, actifs: S.d.clients.filter(c => c.Tag === 'Won').length,
    annuel: echeances ? 1 - Math.pow(1 - perdus / echeances, f) : null };
}
const churnUtilise = () => { const r = churnReel(); return r.echeances >= 10 ? r.annuel : R('CHURN_ANNUEL') / 100; };

/**
 * Plan mois par mois : nouveaux clients visés + rachats attendus des clients déjà signés
 * (un rachat tous les 12 / commandes par an mois, chaque client restant avec la probabilité (1 − churn)^(1 / commandes par an)).
 */
function planObjectifs() {
  const obj = String(S.d.reglages.OBJECTIFS_NOUVEAUX || '').split(/[,; ]+/).filter(Boolean).map(Number).filter(n => n >= 0);
  const f = R('COMMANDES_PAR_AN') || 2.5, intervalle = 12 / f, garde = Math.pow(1 - churnUtilise(), 1 / f);
  const n = Math.max(obj.length, 12) + 12; // une année de plus pour la projection du stock
  const mois = Array.from({ length: n }, (_, i) => ({ i, debut: plusMois(moisDebut(), i), nouveaux: i < obj.length ? obj[i] : obj[obj.length - 1] || 0, rachats: 0 }));
  mois.forEach((m, c) => {
    for (let k = 1; ; k++) {
      const j = Math.round(c + k * intervalle);
      if (j >= n) break;
      mois[j].rachats += m.nouveaux * Math.pow(garde, k);
    }
  });
  let cumul = 0, actifs = 0;
  mois.forEach(m => {
    m.rachats = Math.round(m.rachats);
    m.ventes = m.nouveaux + m.rachats;
    cumul += m.nouveaux;
    m.cumulNouveaux = cumul;
    actifs = actifs * Math.pow(garde, 1 / intervalle) + m.nouveaux;
    m.actifs = Math.round(actifs);
  });
  return mois;
}

/** Ventes réelles d'une période (option : seulement les clients d'un owner). */
function ventesEntre(de, a, owner) {
  return S.d.commandes.filter(x => {
    const d = new Date(x.Date);
    if (d < de || d >= a) return false;
    return !owner || (client(x.ClientID) || {}).Owner === owner;
  });
}
function bilan(cmds, cout) {
  const e = economie();
  const ca = cmds.reduce((t, x) => t + montantCommande(x) + (Number(x['Livraison HT']) || 0), 0);
  const marchandises = cmds.reduce((t, x) => t + (Number(x.Bidons) || 0) * cout, 0);
  const envois = cmds.length * R('COUT_ENVOI_HT');
  return { ventes: cmds.length, nouveaux: cmds.filter(x => x.Type !== 'Rachat').length, rachats: cmds.filter(x => x.Type === 'Rachat').length,
    ca, marchandises, envois, net: ca - marchandises - envois, bidons: cmds.reduce((t, x) => t + (Number(x.Bidons) || 0), 0), e };
}

/**
 * Stock et réassort, jour par jour sur 18 mois, avec les ventes du plan :
 * on commande quand le stock prévu à la réception (délai en jours ouvrés) passerait sous le stock de sécurité.
 * 1re commande : 1 palette ; 1re recommande : 1 palette sans box ; ensuite 3 palettes avec box (remise, livraison offerte).
 */
function planStock() {
  const e = economie(), plan = planObjectifs();
  const recus = S.d.achats.filter(a => a.Statut === 'Reçue');
  const stock = R('STOCK_INITIAL_BIDONS') + recus.reduce((t, a) => t + (Number(a.Bidons) || 0), 0) - S.d.commandes.reduce((t, x) => t + (Number(x.Bidons) || 0), 0);
  const delai = R('DELAI_PALETTE_JO') || 10, secu = R('STOCK_SECURITE_JOURS') || 7;
  const conso = d => {
    const m = plan[Math.max(0, Math.min(plan.length - 1, indexMois(d)))];
    return m.ventes * e.B / new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  };
  const arrivees = S.d.achats.filter(a => a.Statut !== 'Reçue').map(a => ({
    date: debutJour(a['Réception prévue'] ? new Date(a['Réception prévue']) : ajouterJoursOuvres(new Date(a['Date commande']), delai)), bidons: Number(a.Bidons) || 0 }));
  const enCommande = arrivees.reduce((t, a) => t + a.bidons, 0);
  let nb = S.d.achats.length, niveau = stock, rupture = null;
  const propositions = [], jours = [];
  const auj = debutJour();
  for (let j = 0; j < 540; j++) {
    const jour = new Date(auj.getFullYear(), auj.getMonth(), auj.getDate() + j);
    arrivees.filter(a => +a.date === +jour).forEach(a => { niveau += a.bidons; });
    const reception = debutJour(ajouterJoursOuvres(jour, delai));
    let besoin = 0, attendu = niveau;
    for (let d = new Date(jour); d < reception; d.setDate(d.getDate() + 1)) besoin += conso(d);
    for (let k = 0; k < secu; k++) besoin += conso(new Date(reception.getFullYear(), reception.getMonth(), reception.getDate() + k));
    arrivees.filter(a => a.date > jour && a.date <= reception).forEach(a => { attendu += a.bidons; });
    if (attendu < besoin) {
      const palettes = nb < 2 ? 1 : 3, par3 = palettes >= 3;
      const p = { date: jour, reception, palettes, bidons: palettes * e.parPalette, box: par3,
        montant: palettes * R('PRIX_PALETTE_HT') * (par3 ? 1 - R('REMISE_3_PALETTES') / 100 : 1), livraison: par3 ? 0 : R('LIVRAISON_PALETTE_HT') };
      propositions.push(p);
      arrivees.push({ date: reception, bidons: p.bidons });
      nb++;
    }
    niveau -= conso(jour);
    if (niveau < 0 && !rupture) rupture = jour;
    jours.push({ jour, niveau });
  }
  const debutBox = [...S.d.achats.filter(a => a.Box === true || a.Box === 'TRUE').map(a => new Date(a['Date commande'])), ...propositions.filter(p => p.box).map(p => p.date)].sort((a, b) => a - b)[0] || null;
  const couverture = (() => { let n = stock, k = 0; while (n > 0 && k < 400) { n -= conso(new Date(auj.getFullYear(), auj.getMonth(), auj.getDate() + k)); k++; } return k; })();
  return { stock, enCommande, propositions, rupture, jours, debutBox, couverture, conso: conso(auj) };
}
/** Début réel d'une période d'objectif : le 1er mois démarre exceptionnellement plus tôt (fin octobre comptée avec novembre). */
function debutPeriode(debutM) {
  const d = indexMois(debutM) === 0 && S.d.reglages.DEBUT_PREMIERE_PERIODE ? new Date(S.d.reglages.DEBUT_PREMIERE_PERIODE + 'T00:00') : null;
  return d && !isNaN(d) && d < debutM ? d : debutM;
}
const boxActive = (debutBox, debutM) => debutBox && debutBox < plusMois(debutM, 1);

  const debutM = S.moisObj, finM = plusMois(debutM, 1), i = indexMois(debutM), deP = debutPeriode(debutM);
  const owners = S.d.owners, qui = S.quiObj || '';

    '<div class="grille-obj">' +
      '<div class="carte kpi principal-kpi"><div class="kpi-tete"><span class="etiquette">Ventes du mois</span><span class="pct ' + (pct(reel.ventes, obj.ventes) >= 100 ? 'ok' : '') + '">' + pctTxt(reel.ventes, obj.ventes) + '</span></div>' +
        '<div class="kpi-chiffre"><b data-compte="' + reel.ventes + '">' + reel.ventes + '</b><span>/ ' + obj.ventes + '</span></div>' + barre(reel.ventes, obj.ventes, 'grande') +

  $$('[data-mois]').forEach(b => b.onclick = () => { S.moisObj = plan[Number(b.dataset.mois)].debut; pageObjectifs(); });
  $('#obRachats').onclick = () => { S.vue = 'rachat'; S.filtres = null; aller('clients'); };
  $('#obHyp').onclick = fenetreHypotheses;
  compterChiffres();

/** Les grands chiffres défilent jusqu'à leur valeur. */
function compterChiffres() {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  $$('[data-compte]').forEach(el => {
    const fin = Number(el.dataset.compte), t0 = performance.now();
    if (!fin) return;
    const pas = t => { const k = Math.min((t - t0) / 600, 1); el.textContent = Math.round(fin * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(pas); };
    requestAnimationFrame(pas);
  });
}

// =================================================================== Page Stock & compta
function pageStock() {
  const e = economie(), st = planStock(), plan = planObjectifs();
  const prochaine = st.propositions[0];
  const fmtJ = d => d.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' });
  const cartons = n => Math.floor(n / 4);
  const achats = S.d.achats.slice().sort((a, b) => String(b['Date commande']).localeCompare(String(a['Date commande'])));
  // Compta : 12 mois à partir du premier mois des objectifs ; réel jusqu'au mois en cours, plan ensuite.
  const auj = new Date(), moisCourant = new Date(auj.getFullYear(), auj.getMonth(), 1);
  const q = S.d.qonto || {}, banque = !!q.connecte && q.solde !== undefined;
  let treso = banque ? q.solde : 0; // avec Qonto, la prévision part du solde réel
  const fluxBanque = (de, a, sens) => S.d.banque.filter(b => b.Sens === sens && new Date(b.Date) >= de && new Date(b.Date) < a).reduce((t, b) => t + Math.abs(Number(b.Montant) || 0), 0);
  const lignes = plan.slice(0, 12).map(m => {
    const fin = plusMois(m.debut, 1), futur = m.debut > moisCourant;
    const cout = st.debutBox && st.debutBox < fin ? e.cout3 : e.cout1;
    const reel = bilan(ventesEntre(m.debut, fin), e.coutReel);
    const ventes = futur ? m.ventes : reel.ventes;
    const ca = futur ? m.ventes * (e.B * e.prix + R('LIVRAISON_CLIENT_HT')) : reel.ca;
    const marchandises = futur ? m.ventes * e.B * cout : reel.marchandises;
    const envois = ventes * R('COUT_ENVOI_HT');
    const box = boxActive(st.debutBox, m.debut) ? R('BOX_MOIS_HT') : 0;
    const achatsMois = S.d.achats.filter(a => { const d = new Date(a['Date commande']); return d >= m.debut && d < fin; })
      .reduce((t, a) => t + (Number(a['Montant HT']) || 0) + (Number(a['Livraison HT']) || 0), 0);
    const suggeres = st.propositions.filter(p => p.date >= m.debut && p.date < fin).reduce((t, p) => t + p.montant + p.livraison, 0);
    const net = ca - marchandises - envois - box;
    treso += ca - envois - box - achatsMois - suggeres;
    // Avec Qonto : solde réel pour les mois écoulés et le mois en cours, puis prévision à partir du solde actuel.
    let tresoReelle = false;
    if (banque && !futur) {
      const s = +m.debut === +moisCourant ? q.solde : soldeAu(fin);
      if (s !== null) { treso = s; tresoReelle = true; }
    }
    const entrees = banque && !futur ? fluxBanque(m.debut, fin, 'Crédit') : null, sorties = banque && !futur ? fluxBanque(m.debut, fin, 'Débit') : null;
    return { m, futur, ventes, ca, marchandises, envois, box, net, achatsMois, suggeres, treso, tresoReelle, entrees, sorties, courant: +m.debut === +moisCourant };
  });

  $('#page').innerHTML = '<div class="page stock">' +
    '<div class="entete"><div><h1>Stock &amp; compta</h1><p>Projection alignée sur les objectifs · ' + esc(e.parPalette) + ' bidons par palette · livraison palette en ' + R('DELAI_PALETTE_JO') + ' jours ouvrés maximum</p></div>' +
      '<div class="rangee"><button class="btn" id="stHyp">' + ico('reglages') + 'Hypothèses</button><button class="btn principal" id="stAchat">' + ico('plus') + 'J’ai commandé une palette</button></div></div>' +
    '<div class="stats">' +
      '<div class="carte stat"><span class="etiquette">Stock actuel</span><b class="' + (st.stock <= 0 ? 'rouge' : '') + '">' + st.stock + ' bidons</b><span class="doux petit">' + cartons(Math.max(st.stock, 0)) + ' cartons · ' + (Math.round(Math.max(st.stock, 0) / e.parPalette * 10) / 10).toString().replace('.', ',') + ' palette</span></div>' +
      (banque ? '<div class="carte stat"><span class="etiquette">Banque Qonto</span><b class="' + (q.solde < 0 ? 'rouge' : '') + '">' + euros(q.solde, 2) + '</b><span class="doux petit">Solde réel · ' + (q.synchro ? esc(relatif(q.synchro)) : '') + '</span></div>' : '') +
      '<div class="carte stat"><span class="etiquette">En commande</span><b>' + st.enCommande + ' bidons</b><span class="doux petit">' + S.d.achats.filter(a => a.Statut !== 'Reçue').length + ' livraison(s) attendue(s)</span></div>' +
      '<div class="carte stat"><span class="etiquette">Couverture</span><b class="' + (st.couverture < (R('DELAI_PALETTE_JO') * 1.4 + R('STOCK_SECURITE_JOURS')) ? 'orange' : '') + '">' + st.couverture + ' jours</b><span class="doux petit">≈ ' + (Math.round(st.conso * 10) / 10).toString().replace('.', ',') + ' bidons vendus / jour prévus</span></div>' +
      '<div class="carte stat ' + (prochaine && prochaine.date <= auj ? 'alerte-stat' : '') + '"><span class="etiquette">Prochaine commande suggérée</span>' +
        (prochaine ? '<b>' + (prochaine.date <= auj ? 'Dès votre feu vert' : fmtJ(prochaine.date)) + '</b><span class="doux petit">' + prochaine.palettes + ' palette' + (prochaine.palettes > 1 ? 's' : '') + (prochaine.box ? ' + box' : '') + ' · ' + euros(prochaine.montant + prochaine.livraison) + ' HT · reçue vers le ' + fmtJ(prochaine.reception) + '</span>' : '<b>—</b>') + '</div>' +
    '</div>' +
    carteBanque() +
    '<div class="carte" style="margin-bottom:16px"><div class="carte-tete"><h2>Nos commandes fournisseur</h2><button class="btn mini principal" id="stAchat2">' + ico('plus') + 'J’ai commandé</button></div>' +
      (achats.length ? achats.map((a, n) => '<div class="tache" style="--n:' + n + '"><span class="type">' + ico('stock') + '</span><div class="corps"><b>' + esc(a.Palettes) + ' palette(s) · ' + esc(a.Bidons) + ' bidons</b>' +
        '<div class="sous"><span>Commandée le ' + esc(fmtDate(a['Date commande'])) + '</span><span>' + euros((Number(a['Montant HT']) || 0) + (Number(a['Livraison HT']) || 0), 2) + ' HT</span>' +
        (a.Statut === 'Reçue' ? '<span class="puce vert">Reçue le ' + esc(fmtDate(a['Reçue le'])) + '</span>' : '<span class="puce orange">Attendue vers le ' + esc(fmtDate(a['Réception prévue'])) + '</span>') + '</div></div>' +
        (a.Statut !== 'Reçue' ? '<button class="btn mini" data-recue="' + a.ID + '">' + ico('ok') + 'Reçue</button>' : '') +
        '<button class="btn fantome icone" data-achat="' + a.ID + '" aria-label="Modifier">' + ico('crayon') + '</button></div>').join('')
        : '<div class="vide">' + ico('stock') + '<b>Aucune commande passée</b>Quand vous commandez vraiment une palette, cliquez « J’ai commandé » : date, quantité et prix sont modifiables. Le stock, le réassort et la compta se recalculent à partir de vos vraies commandes.</div>') + '</div>' +
    '<div class="grille-obj deux">' +
      '<div class="carte"><div class="carte-tete"><h2>Réassort suggéré</h2><span class="pale petit">1re recommande : 1 palette · ensuite 3 palettes + box</span></div>' +
        (st.propositions.length ? '<div class="reassort">' + st.propositions.slice(0, 6).map((p, n) => '<div class="ligne-reassort" style="--n:' + n + '"><span class="bulle ' + (p.box ? 'box' : '') + '">' + ico('stock') + '</span>' +
          '<div style="flex:1;min-width:0"><b>' + (p.date <= auj ? 'À commander dès votre feu vert' : 'À commander vers le ' + fmtJ(p.date)) + '</b><div class="doux petit">' + p.palettes + ' palette' + (p.palettes > 1 ? 's' : '') + ' · ' + p.bidons + ' bidons · reçue vers le ' + fmtJ(p.reception) +
          (p.box ? ' · −' + R('REMISE_3_PALETTES') + ' %, livraison offerte' : '') + '</div></div><b class="montant">' + euros(p.montant + p.livraison) + '</b>' +
          (n === 0 ? '<button class="btn mini" data-suggestion="0" title="Enregistrer cette commande comme passée">' + ico('ok') + 'Commandée</button>' : '') + '</div>').join('') + '</div>'
          : '<div class="carte-corps doux">Aucune commande nécessaire sur 18 mois.</div>') +
        '<div class="carte-corps pale petit" style="border-top:1px solid var(--trait)">Ce sont des suggestions : rien n’est commandé tant que vous ne l’enregistrez pas. Calcul : stock prévu à la réception sous ' + R('STOCK_SECURITE_JOURS') + ' jours de ventes (objectifs + rachats estimés). Dès qu’une vraie commande est saisie, les suggestions se recalent dessus.</div></div>' +
      '<div class="carte"><div class="carte-tete"><h2>Stock prévu</h2><span class="pale petit">6 mois, réassort compris</span></div><div class="courbe-stock">' + courbeStock(st) + '</div></div>' +
    '</div>' +
    '<div class="carte tableau-compta" style="margin-top:16px"><div class="carte-tete"><h2>Compta mensuelle</h2><span class="pale petit">€ HT · réel jusqu’au mois en cours, prévision ensuite</span></div><div class="defile-x"><table>' +
      '<tr><th>Mois</th><th>Ventes</th><th>CA</th><th>Marchandises</th><th>Envois</th><th>Box</th><th>Net</th><th>Achats passés</th><th>Achats suggérés</th>' + (banque ? '<th>Encaissé (banque)</th><th>Décaissé (banque)</th>' : '') + '<th>' + (banque ? 'Trésorerie' : 'Trésorerie prév.') + '</th></tr>' +
      lignes.map(l => '<tr class="' + (l.futur ? 'futur' : '') + (l.courant ? ' courant' : '') + '"><td>' + esc(l.m.debut.toLocaleDateString('fr-FR', { month: 'short', year: '2-digit' })) + (l.futur ? '' : ' ●') + '</td><td>' + l.ventes + '</td><td>' + euros(l.ca) + '</td>' +
        '<td>−' + euros(l.marchandises) + '</td><td>−' + euros(l.envois) + '</td><td>' + (l.box ? '−' + euros(l.box) : '—') + '</td><td class="' + (l.net >= 0 ? 'vert' : 'rouge') + '"><b>' + euros(l.net) + '</b></td>' +
        '<td>' + (l.achatsMois ? '−' + euros(l.achatsMois) : '—') + '</td><td class="pale">' + (l.suggeres ? '−' + euros(l.suggeres) : '—') + '</td>' +
        (banque ? '<td>' + (l.entrees !== null ? euros(l.entrees) : '—') + '</td><td>' + (l.sorties !== null ? (l.sorties ? '−' : '') + euros(l.sorties) : '—') + '</td>' : '') +
        '<td class="' + (l.treso >= 0 ? '' : 'rouge') + '">' + (l.tresoReelle ? '<b>' + euros(l.treso) + '</b> ●' : euros(l.treso)) + '</td></tr>').join('') +
      '<tr class="total"><td>12 mois</td><td>' + lignes.reduce((t, l) => t + l.ventes, 0) + '</td><td>' + euros(lignes.reduce((t, l) => t + l.ca, 0)) + '</td><td></td><td></td><td></td><td><b>' + euros(lignes.reduce((t, l) => t + l.net, 0)) + '</b></td><td>−' + euros(lignes.reduce((t, l) => t + l.achatsMois, 0)) + '</td><td class="pale">−' + euros(lignes.reduce((t, l) => t + l.suggeres, 0)) + '</td>' + (banque ? '<td></td><td></td>' : '') + '<td></td></tr>' +
    '</table></div><div class="carte-corps pale petit">● = réel. Net = CA − marchandises vendues (prix de revient du bidon) − envois − box. ' + (banque ? 'Trésorerie : solde réel Qonto (●) pour les mois écoulés et le mois en cours, puis solde actuel + encaissements prévus − achats (passés et suggérés) − envois − box.' : 'Trésorerie prévisionnelle = encaissements − achats (passés et suggérés) − envois − box, cumulée. Connectez Qonto (Réglages) pour partir du solde réel.') + '</div></div>' +
    '</div>';
  $('#stHyp').onclick = fenetreHypotheses;
  brancherBanque();
  $('#stAchat').onclick = $('#stAchat2').onclick = () => fenetreAchat(null, prochaine);
  $$('[data-suggestion]').forEach(b => b.onclick = () => fenetreAchat(null, prochaine));
  $$('[data-achat]').forEach(b => b.onclick = () => fenetreAchat(S.d.achats.find(a => a.ID === b.dataset.achat)));
  $$('[data-recue]').forEach(b => b.onclick = () => {
    const a = S.d.achats.find(x => x.ID === b.dataset.recue);
    occupe(b, appel('crmAchat', { ID: a.ID, dateCommande: a['Date commande'], reception: a['Réception prévue'], palettes: a.Palettes, bidons: a.Bidons, montant: a['Montant HT'],
      livraison: a['Livraison HT'], box: a.Box === true || a.Box === 'TRUE', notes: a.Notes, recue: true })).then(x => { remplacer(S.d.achats, x); pageStock(); toast('Stock mis à jour : +' + x.Bidons + ' bidons'); });
  });
}

/** Courbe du stock prévu (SVG), 6 mois. */
function courbeStock(st) {
  const pts = st.jours.slice(0, 183), max = Math.max(...pts.map(p => p.niveau), 1), min = Math.min(...pts.map(p => p.niveau), 0);
  const W = 600, H = 180, x = i => i / (pts.length - 1) * W, y = v => H - (v - min) / (max - min || 1) * (H - 16) - 8;
  const ligne = pts.map((p, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.niveau).toFixed(1)).join(' ');
  const mois = pts.filter(p => p.jour.getDate() === 1).map(p => { const i = pts.indexOf(p); return '<line x1="' + x(i) + '" x2="' + x(i) + '" y1="0" y2="' + H + '" class="grille-l"/><text x="' + (x(i) + 4) + '" y="12">' + p.jour.toLocaleDateString('fr-FR', { month: 'short' }) + '</text>'; }).join('');
  const commandes = st.propositions.filter(p => p.date < pts[pts.length - 1].jour).map(p => { const i = pts.findIndex(q => +q.jour === +debutJour(p.date)); return i < 0 ? '' : '<line x1="' + x(i) + '" x2="' + x(i) + '" y1="' + (y(pts[i].niveau) - 10) + '" y2="' + H + '" class="pt-cmd"><title>Commander ' + p.palettes + ' palette(s)</title></line>'; }).join('');
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" class="svg-stock">' + mois +
    (min < 0 ? '<line x1="0" x2="' + W + '" y1="' + y(0) + '" y2="' + y(0) + '" class="zero"/>' : '') +
    '<path d="' + ligne + ' L' + W + ' ' + H + ' L0 ' + H + ' Z" class="aire"/><path d="' + ligne + '" class="trait"/>' + commandes + '</svg>' +
    '<div class="legende"><span><i class="reel"></i>Stock prévu (bidons)</span><span><i class="pt"></i>Commande à passer</span>' + (st.rupture ? '<span class="rouge">Rupture prévue le ' + esc(st.rupture.toLocaleDateString('fr-FR')) + ' sans commande immédiate</span>' : '') + '</div>';
}

function fenetreAchat(a, suggestion) {
  const e = economie(), r = S.d.reglages;
  const v = a ? { palettes: a.Palettes, date: a['Date commande'], reception: a['Réception prévue'], montant: a['Montant HT'], livraison: a['Livraison HT'], box: a.Box === true || a.Box === 'TRUE', bidons: a.Bidons, notes: a.Notes }
    : { palettes: suggestion ? suggestion.palettes : 1, date: new Date().toISOString(), notes: '' };
  const f = fenetre({ titre: a ? 'Commande fournisseur' : 'Nouvelle commande fournisseur', corps:
    '<div class="grille-2"><label class="champ"><span>Palettes</span><input type="number" id="acP" min="1" step="1" value="' + esc(v.palettes) + '"></label>' +
    '<label class="champ"><span>Bidons</span><input type="number" id="acB" min="0" step="1"></label>' +
    '<label class="champ"><span>Date de commande</span><input type="date" id="acD" value="' + dateLocale(new Date(v.date)) + '"></label>' +
    '<label class="champ"><span>Réception prévue</span><input type="date" id="acR"></label>' +
    '<label class="champ"><span>Montant palettes (€ HT)</span><input type="number" id="acM" step="0.01"></label>' +
    '<label class="champ"><span>Livraison (€ HT)</span><input type="number" id="acL" step="0.01"></label></div>' +
    '<label class="interrupteur" style="margin-bottom:12px"><input type="checkbox" id="acBox"' + (v.box ? ' checked' : '') + '><i></i>Avec box de stockage (' + euros(R('BOX_MOIS_HT')) + ' / mois)</label>' +
    '<label class="interrupteur" style="margin-bottom:12px;display:flex"><input type="checkbox" id="acRecue"' + (a && a.Statut === 'Reçue' ? ' checked' : '') + '><i></i>Déjà reçue (compte dans le stock)</label>' +
    '<label class="champ"><span>Notes</span><input type="text" id="acN" value="' + esc(v.notes || '') + '"></label>',
    pied: (a ? '<button class="btn danger gauche" id="acSuppr">' + ico('poubelle') + 'Supprimer</button>' : '') + '<button class="btn" data-fermer>Annuler</button><button class="btn principal" id="acOk">Enregistrer</button>' });
  // Valeurs calculées selon le nombre de palettes (modifiables) : par 3, remise et livraison offerte.
  const calculer = () => {
    const n = Number(f.$('#acP').value) || 1, par3 = n >= 3;
    f.$('#acB').value = n * e.parPalette;
    f.$('#acM').value = (n * R('PRIX_PALETTE_HT') * (par3 ? 1 - R('REMISE_3_PALETTES') / 100 : 1)).toFixed(2);
    f.$('#acL').value = par3 ? 0 : R('LIVRAISON_PALETTE_HT');
    f.$('#acBox').checked = par3 || f.$('#acBox').checked;
  };
  const reception = () => { f.$('#acR').value = dateLocale(ajouterJoursOuvres(new Date(f.$('#acD').value + 'T12:00'), R('DELAI_PALETTE_JO'))); };
  if (a) { f.$('#acB').value = v.bidons; f.$('#acM').value = v.montant; f.$('#acL').value = v.livraison; f.$('#acR').value = v.reception ? dateLocale(new Date(v.reception)) : ''; if (!v.reception) reception(); }
  else { calculer(); reception(); }
  f.$('#acP').oninput = calculer;
  f.$('#acD').onchange = reception;
  f.$('#acOk').onclick = () => occupe(f.$('#acOk'), appel('crmAchat', { ID: a ? a.ID : '', palettes: f.$('#acP').value, bidons: f.$('#acB').value,
    dateCommande: new Date(f.$('#acD').value + 'T12:00').toISOString(), reception: f.$('#acR').value ? new Date(f.$('#acR').value + 'T12:00').toISOString() : '',
    montant: f.$('#acM').value, livraison: f.$('#acL').value, box: f.$('#acBox').checked, notes: f.$('#acN').value.trim(), recue: f.$('#acRecue').checked,
    recueLe: a && a['Reçue le'] ? a['Reçue le'] : '' })).then(x => { remplacer(S.d.achats, x); f.fermer(); afficher(); toast('Commande fournisseur enregistrée'); });
  if (a) f.$('#acSuppr').onclick = () => confirmer('Supprimer cette commande fournisseur ?', 'Le stock sera recalculé sans elle.', 'Supprimer').then(ok => ok &&
    appel('crmSupprimerAchat', a.ID).then(() => { S.d.achats = S.d.achats.filter(x => x.ID !== a.ID); f.fermer(); afficher(); toast('Supprimée'); }));
}

lancerCRM();
</script>
</body>
