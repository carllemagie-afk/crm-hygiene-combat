<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calculateur de consommation · Hygiène & Combat</title>
<meta name="description" content="Combien de temps dure votre commande de désinfectant Hygiène & Combat ?">
<!--
  Calculateur de consommation Hygiène & Combat (copié dans l'application par build.py, https://script.google.com/macros/s/AKfycbyi4wD91ajHJmD_goYeQZRiTgZgCQYApcerBk6cUuFYGVyEATy_SHLW0CKrnn9y20T1/exec remplacé).
  Ouvert depuis le CRM : menu « Calculateur », ou bouton « Conso » d'une fiche (?client=ID&nom=…&salle=…).
  « Créer le PDF client » fabrique le PDF ; depuis une fiche, « Enregistrer sur la fiche » le range chez le client
  (comme l'outil comparaison) : il peut alors être joint aux e-mails avec {{Consommation PDF}}.

  Paramètres d'adresse (facultatifs) : ?tatamis=200&jours=6&parjour=1 (pré-remplissage), ?salle=…, ?client=ID&nom=…
-->
<style>
  :root { --encre: #13181a; --bleu: #264963; --ciel: #8bc4e4; --pale: #eaf4fa; --doux: #5b6b75; --trait: #d3e6f2; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: #fff; color: var(--encre); font: 15px/1.45 "Avenir Next", Avenir, "Segoe UI", system-ui, -apple-system, sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 18px 18px 24px; }
  header { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  header img { width: 56px; height: auto; flex: none; }
  .surtitre { text-transform: uppercase; letter-spacing: 1.4px; font-size: 11px; font-weight: 600; color: var(--bleu); }
  h1 { margin: 1px 0 0; font-size: 22px; line-height: 1.2; letter-spacing: -.2px; }
  .grille { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 18px; align-items: start; }
  .panneau { border: 1px solid var(--trait); border-radius: 14px; padding: 16px; }
  .champ { display: block; margin-bottom: 14px; }
  .champ:last-child { margin-bottom: 0; }
  .champ > span { display: block; font-weight: 600; font-size: 14px; margin-bottom: 5px; }
  .saisie { display: flex; align-items: center; border: 1px solid var(--ciel); border-radius: 9px; overflow: hidden; }
  .saisie:focus-within { outline: 2px solid var(--bleu); outline-offset: 1px; }
  .saisie input { flex: 1; min-width: 0; border: 0; padding: 9px 10px; font: inherit; font-size: 16px; text-align: center; color: var(--encre); background: transparent; outline: none; }
  .saisie em { font-style: normal; color: var(--doux); padding-right: 10px; font-size: 13.5px; }
  .saisie button { border: 0; background: var(--pale); color: var(--bleu); font-size: 20px; width: 40px; align-self: stretch; cursor: pointer; }
  .saisie button:hover { background: var(--ciel); }
  .puces { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
  .puces button { border: 1px solid var(--ciel); background: #fff; color: var(--bleu); border-radius: 20px; padding: 3px 10px; font: inherit; font-size: 12.5px; cursor: pointer; }
  .puces button[aria-pressed="true"] { background: var(--bleu); border-color: var(--bleu); color: #fff; }
  .reco { background: var(--bleu); color: #fff; border-radius: 12px; padding: 14px 18px; }
  .reco .surtitre { color: var(--ciel); }
  .reco .grand { font-size: 30px; font-weight: 700; line-height: 1.15; margin: 2px 0 4px; letter-spacing: -.3px; }
  .reco p { margin: 0; color: #dcecf6; font-size: 13.5px; }
  .tableau { margin-top: 10px; border: 1px solid var(--trait); border-radius: 12px; padding: 4px 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--trait); }
  tr:last-child td { border-bottom: 0; }
  th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .8px; color: var(--bleu); font-weight: 600; }
  td.n, th.n { text-align: right; white-space: nowrap; }
  .cartes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 10px; }
  .carte { border: 1px solid var(--trait); border-radius: 12px; padding: 12px 14px; background: var(--pale); }
  .carte .titre { font-size: 11.5px; text-transform: uppercase; letter-spacing: .8px; color: var(--bleu); font-weight: 600; }
  .carte .valeur { font-size: 20px; font-weight: 700; margin: 3px 0 0; line-height: 1.2; }
  .carte .detail { font-size: 12.5px; color: var(--doux); }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 14px; }
  .bouton { border: 0; border-radius: 9px; background: var(--bleu); color: #fff; font: inherit; font-weight: 600; padding: 10px 16px; cursor: pointer; text-decoration: none; display: inline-block; }
  .bouton.leger { background: var(--pale); color: var(--bleu); }
  .bouton:disabled { opacity: .6; cursor: default; }
  .statut { font-size: 13.5px; color: var(--doux); }
  .statut.erreur { color: #b42318; }
  @media (max-width: 760px) {
    .grille { grid-template-columns: minmax(0, 1fr); }
    .cartes { grid-template-columns: minmax(0, 1fr); }
    .reco .grand { font-size: 26px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <img src="logo.png" alt="Hygiène & Combat" width="127" height="108">
    <div>
      <div class="surtitre">Calculateur de consommation</div>
      <h1 id="titre">Combien de temps dure votre commande ?</h1>
    </div>
  </header>

  <div class="grille">
    <section class="panneau" aria-label="Votre salle">
      <label class="champ"><span>Surface de tatamis</span>
        <div class="saisie"><button type="button" data-pas="-10" aria-label="Moins 10 m²">−</button><input id="tatamis" type="number" inputmode="decimal" min="0" step="1" value="200"><em>m²</em><button type="button" data-pas="10" aria-label="Plus 10 m²">+</button></div>
      </label>
      <label class="champ"><span>Jours d'entraînement par semaine</span>
        <div class="saisie"><button type="button" data-pas="-1" aria-label="Moins un jour">−</button><input id="jours" type="number" inputmode="decimal" min="0" max="7" step="1" value="6"><em>jours</em><button type="button" data-pas="1" aria-label="Plus un jour">+</button></div>
      </label>
      <label class="champ"><span>Nettoyages par jour</span>
        <div class="saisie"><button type="button" data-pas="-1" aria-label="Moins un nettoyage">−</button><input id="parjour" type="number" inputmode="decimal" min="0" step="1" value="1"><em>fois</em><button type="button" data-pas="1" aria-label="Plus un nettoyage">+</button></div>
        <div class="puces" data-cible="parjour">
          <button type="button" data-valeur="1">Fin de journée</button>
          <button type="button" data-valeur="2">Midi et soir</button>
          <button type="button" data-valeur="4">Après chaque cours</button>
        </div>
      </label>
    </section>

    <section aria-live="polite" aria-label="Résultat">
      <div class="reco">
        <div class="surtitre">Votre première commande vous durera</div>
        <div class="grand" id="r-commande">—</div>
        <p id="r-pour"></p>
      </div>
      <div class="cartes">
        <div class="carte"><div class="titre">Un bidon dure</div><div class="valeur" id="r-bidon">—</div></div>
        <div class="carte"><div class="titre">Coût par mois</div><div class="valeur" id="r-mois">—</div><div class="detail">hors livraison</div></div>
        <div class="carte"><div class="titre">Par nettoyage</div><div class="valeur" id="r-dose">—</div><div class="detail" id="r-dose-d"></div></div>
      </div>
      <div class="tableau">
        <table>
          <thead><tr><th>Consommation</th><th class="n">Produit pur</th><th class="n">Bidons</th><th class="n">Coût HT</th></tr></thead>
          <tbody id="r-tableau"></tbody>
        </table>
      </div>
      <div class="actions">
        <button class="bouton" type="button" id="pdf">Créer le PDF client</button>
        <span class="statut" id="statut"></span>
      </div>
    </section>
  </div>
</main>

<script src="../comparateur/pdf-lib.js"></script>
<script src="../comparateur/fontkit.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  // Dosage et prix Hygiène & Combat (fixes) : 2 L de solution à 5 % pour 100 m² ; bidon de 5 L à 33 € HT ; 1re commande = 1 carton de 4 bidons.
  const SOLUTION_M2 = 0.02, DILUTION = 0.05, BIDON = 5, PREMIERE_COMMANDE = 4, PRIX_BIDON = 33;
  const CRM_API = 'https://script.google.com/macros/s/AKfycbyi4wD91ajHJmD_goYeQZRiTgZgCQYApcerBk6cUuFYGVyEATy_SHLW0CKrnn9y20T1/exec';
  const CRM_CLIENT = params.get('client') || '', CRM_NOM = params.get('nom') || '';
  const salle = (params.get('salle') || CRM_NOM || '').trim();

  ['tatamis', 'jours', 'parjour'].forEach(c => { if (params.has(c) && params.get(c) !== '' && !isNaN(Number(params.get(c)))) $(c).value = params.get(c); });
  if (salle) $('titre').textContent = salle + ' : combien de temps dure votre commande ?';

  const num = id => Math.max(0, Number(String($(id).value).replace(',', '.')) || 0);
  const nf = (n, d = 0) => n.toLocaleString('fr-FR', { minimumFractionDigits: d, maximumFractionDigits: d });
  const litres = l => l >= 1 ? nf(l, l % 1 ? 1 : 0) + ' L' : nf(l * 1000, 0) + ' ml';
  const pluriel = (n, mot) => n + ' ' + (n > 1 ? mot + 's' : mot);
  /** Durée parlante (semaines, puis mois). */
  function duree(semaines) {
    if (!isFinite(semaines) || semaines <= 0) return '—';
    if (semaines < 1) return pluriel(Math.max(1, Math.round(semaines * 7)), 'jour');
    if (semaines < 6) return pluriel(Math.round(semaines), 'semaine');
    const mois = semaines * 12 / 52;
    if (mois >= 24) return 'plus de 2 ans';
    const arrondi = Math.round(mois * 2) / 2;
    return nf(arrondi, arrondi % 1 ? 1 : 0) + ' mois';
  }

  let r = {};
  function calculer() {
    const surface = num('tatamis'), jours = Math.min(7, num('jours')), parJour = num('parjour');
    const solution = surface * SOLUTION_M2, produit = solution * DILUTION; // par nettoyage
    const parSemaine = produit * parJour * jours;
    r = {
      surface, jours, parJour, solution, produit,
      commande: parSemaine ? duree(PREMIERE_COMMANDE * BIDON / parSemaine) : '—',
      bidon: parSemaine ? duree(BIDON / parSemaine) : '—',
      mois: parSemaine * 52 / 12 * PRIX_BIDON / BIDON,
    };
    // Détail : par nettoyage, semaine, mois (moyenne) et saison (comptée sur 10 mois, sans le dire)
    r.lignes = [['Par nettoyage', produit], ['Par semaine', parSemaine], ['Par mois', parSemaine * 52 / 12], ['Par saison', parSemaine * 52 / 12 * 10]]
      .map(([nom, l]) => [nom, l ? litres(l) : '—', l ? nf(l / BIDON, l / BIDON < 1 ? 2 : 1) : '—', l ? nf(l * PRIX_BIDON / BIDON, l * PRIX_BIDON / BIDON < 10 ? 2 : 0) + ' €' : '—']);
    $('r-tableau').innerHTML = r.lignes.map(([nom, a, b, c]) => '<tr><td>' + nom + '</td><td class="n">' + a + '</td><td class="n">' + b + '</td><td class="n">' + c + '</td></tr>').join('');
    r.pour = 'Pour ' + nf(surface, 0) + ' m² de tatamis, ' + pluriel(jours, 'jour') + ' par semaine, ' + pluriel(parJour, 'nettoyage') + ' par jour.';
    $('r-commande').textContent = parSemaine ? '≈ ' + r.commande : 'Indiquez votre salle';
    $('r-pour').textContent = parSemaine ? r.pour : 'Le calcul se met à jour au fur et à mesure.';
    $('r-bidon').textContent = parSemaine ? '≈ ' + r.bidon : '—';
    $('r-mois').textContent = parSemaine ? '≈ ' + nf(Math.round(r.mois), 0) + ' € HT' : '—';
    $('r-dose').textContent = solution ? litres(solution) : '—';
    $('r-dose-d').textContent = solution ? 'de solution, soit ' + litres(produit) + ' de produit' : '';
    $('pdf').disabled = !parSemaine;
  }

  ['tatamis', 'jours', 'parjour'].forEach(c => $(c).addEventListener('input', () => { majPuces(); calculer(); oublierPdf(); }));
  document.querySelectorAll('[data-pas]').forEach(b => b.addEventListener('click', () => {
    const i = b.parentElement.querySelector('input');
    const v = Math.max(Number(i.min) || 0, (Number(i.value) || 0) + Number(b.dataset.pas));
    i.value = i.max ? Math.min(Number(i.max), v) : v;
    majPuces(); calculer(); oublierPdf();
  }));
  document.querySelectorAll('.puces button').forEach(b => b.addEventListener('click', () => {
    $(b.parentElement.dataset.cible).value = b.dataset.valeur;
    majPuces(); calculer(); oublierPdf();
  }));
  function majPuces() {
    document.querySelectorAll('.puces[data-cible="parjour"] button').forEach(b => b.setAttribute('aria-pressed', String(Number($('parjour').value) === Number(b.dataset.valeur))));
  }

  // ---------------------------------------------------------------- PDF client
  const statut = (html, erreur) => { $('statut').innerHTML = html; $('statut').className = 'statut' + (erreur ? ' erreur' : ''); };
  let urlPdf = '';
  function oublierPdf() { if (urlPdf) { URL.revokeObjectURL(urlPdf); urlPdf = ''; statut(''); } }
  const octets = async chemin => new Uint8Array(await (await fetch(chemin)).arrayBuffer());

  async function creerPdf() {
    const { PDFDocument, rgb } = PDFLib;
    const doc = await PDFDocument.create();
    doc.registerFontkit(fontkit);
    const [reg, gras, logo] = await Promise.all([octets('../comparateur/font-regular.ttf'), octets('../comparateur/font-bold.ttf'), octets('logo.png')]);
    const fR = await doc.embedFont(reg, { subset: true }), fB = await doc.embedFont(gras, { subset: true }), img = await doc.embedPng(logo);
    doc.setTitle('Votre consommation de désinfectant' + (salle ? ' · ' + salle : ''));
    doc.setAuthor('Hygiène & Combat');
    const page = doc.addPage([595.28, 841.89]);
    const W = 595.28, M = 48, L = W - 2 * M;
    const bleu = rgb(38 / 255, 73 / 255, 99 / 255), ciel = rgb(139 / 255, 196 / 255, 228 / 255), pale = rgb(234 / 255, 244 / 255, 250 / 255);
    const encre = rgb(19 / 255, 24 / 255, 26 / 255), doux = rgb(91 / 255, 107 / 255, 117 / 255), clair = rgb(220 / 255, 236 / 255, 246 / 255), blanc = rgb(1, 1, 1);
    const texte = (t, x, y, taille, police, couleur) => page.drawText(t, { x, y, size: taille, font: police, color: couleur });
    const centre = (t, cx, y, taille, police, couleur) => texte(t, cx - police.widthOfTextAtSize(t, taille) / 2, y, taille, police, couleur);

    // En-tête
    const hLogo = 62, lLogo = img.width * hLogo / img.height;
    page.drawImage(img, { x: M, y: 841.89 - M - hLogo, width: lLogo, height: hLogo });
    const xT = M + lLogo + 16;
    texte('CALCUL DE CONSOMMATION', xT, 841.89 - M - 18, 9.5, fB, bleu);
    texte('Votre désinfectant Hygiène & Combat', xT, 841.89 - M - 40, 20, fB, encre);
    texte((salle ? salle + ' · ' : '') + new Date().toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' }), xT, 841.89 - M - 58, 10.5, fR, doux);

    // Cadre bleu : la durée de la première commande
    const yB = 841.89 - M - hLogo - 24 - 110;
    page.drawRectangle({ x: M, y: yB, width: L, height: 110, color: bleu });
    centre('VOTRE PREMIÈRE COMMANDE VOUS DURERA ENVIRON', W / 2, yB + 82, 10, fB, ciel);
    centre(r.commande, W / 2, yB + 44, 30, fB, blanc);
    centre(r.pour, W / 2, yB + 18, 10.5, fR, clair);

    // Trois blocs
    const g = 12, lb = (L - 2 * g) / 3, hb = 76, yb = yB - 14 - hb;
    [['UN BIDON DURE', 'environ ' + r.bidon, ''], ['COÛT PAR MOIS', 'environ ' + nf(Math.round(r.mois), 0) + ' € HT', 'hors livraison'],
      ['PAR NETTOYAGE', litres(r.solution) + ' de solution', 'soit ' + litres(r.produit) + ' de produit']].forEach(([titre, valeur, detail], i) => {
      const x = M + i * (lb + g);
      page.drawRectangle({ x, y: yb, width: lb, height: hb, color: pale, borderColor: rgb(211 / 255, 230 / 255, 242 / 255), borderWidth: 1 });
      texte(titre, x + 14, yb + hb - 22, 8.5, fB, bleu);
      let t = valeur, taille = 15;
      while (fB.widthOfTextAtSize(t, taille) > lb - 28 && taille > 10) taille -= 0.5;
      texte(t, x + 14, yb + hb - 46, taille, fB, encre);
      if (detail) texte(detail, x + 14, yb + 12, 9, fR, doux);
    });

    // Tableau : consommation et coût par nettoyage, semaine, mois, année
    const cols = [M + 14, M + L - 250, M + L - 130, M + L - 14]; // libellé à gauche, chiffres alignés à droite
    let y = yb - 34;
    const ligne = (vals, police, couleur, taille) => {
      texte(vals[0], cols[0], y, taille, police, couleur);
      vals.slice(1).forEach((v, i) => texte(v, cols[i + 1] - police.widthOfTextAtSize(v, taille), y, taille, police, couleur));
    };
    ligne(['CONSOMMATION', 'PRODUIT PUR', 'BIDONS', 'COÛT HT'], fB, bleu, 8.5);
    r.lignes.forEach(v => {
      page.drawLine({ start: { x: M, y: y - 9 }, end: { x: M + L, y: y - 9 }, thickness: 0.7, color: rgb(211 / 255, 230 / 255, 242 / 255) });
      y -= 26;
      ligne(v, v[0] === 'Par saison' ? fB : fR, encre, 11);
    });

    // Pied de page
    texte('Hygiène & Combat · contact@hygiene-combat.fr · hygiene-combat.fr', M, 36, 9, fR, doux);
    return doc.save();
  }

  $('pdf').addEventListener('click', async () => {
    const b = $('pdf');
    b.disabled = true; b.textContent = 'Création…'; oublierPdf();
    try {
      const pdf = await creerPdf();
      const nom = 'Consommation ' + (salle || 'Hygiène & Combat').replace(/[^\wÀ-ÿ -]/g, '').trim() + '.pdf';
      urlPdf = URL.createObjectURL(new Blob([pdf], { type: 'application/pdf' }));
      statut('PDF prêt. ' + (CRM_CLIENT ? '<button class="bouton" id="garder">Enregistrer sur la fiche</button> ' : '') +
        '<a class="bouton leger" href="' + urlPdf + '" download="' + nom.replace(/"/g, '') + '">↓ Télécharger</a> <a href="' + urlPdf + '" target="_blank" rel="noopener">Ouvrir le PDF ↗</a>');
      if (CRM_CLIENT) $('garder').onclick = () => garder(pdf, nom);
    } catch (e) { statut('Le PDF n’a pas pu être créé : ' + e.message, true); }
    b.disabled = false; b.textContent = 'Créer le PDF client';
  });

  /** Range le PDF sur la fiche du client (même mécanisme que l'outil comparaison). */
  async function garder(pdf, nom) {
    const b = $('garder');
    b.disabled = true; b.textContent = 'Enregistrement…';
    try {
      const jeton = (() => { try { return localStorage.getItem('crm_session') || ''; } catch (e) { return ''; } })();
      if (!jeton) throw Error('Connectez-vous d’abord au CRM.');
      let base64 = ''; for (let i = 0; i < pdf.length; i += 0x8000) base64 += String.fromCharCode.apply(null, pdf.subarray(i, i + 0x8000));
      // « Produit » : résumé lu par le CRM (carte de la fiche et variable {{Durée commande}} des e-mails)
      const resume = 'Consommation · première commande ' + r.commande + ' · 1 bidon ' + r.bidon + ' · ' + nf(r.surface, 0) + ' m², ' + r.jours + ' j/sem., ' + r.parJour + '/jour';
      const j = await (await fetch(CRM_API, { method: 'POST', body: JSON.stringify({ fn: 'crmEnregistrerComparatif', args: [CRM_CLIENT, nom, btoa(base64), resume], jeton }) })).json();
      if (!j.ok) throw Error(j.erreur === 'SESSION_EXPIREE' ? 'Session du CRM expirée : reconnectez-vous.' : j.erreur);
      b.textContent = '✓ Enregistré sur la fiche' + (CRM_NOM ? ' de ' + CRM_NOM : '');
      try { parent.postMessage({ type: 'crm-comparatif', comparatif: j.r }, location.origin); } catch (e) { /* hors CRM */ }
    } catch (e) { b.disabled = false; b.textContent = 'Enregistrer sur la fiche'; statut('Non enregistré : ' + e.message, true); }
  }

  majPuces();
  calculer();

  // Dans le CRM (cadre de la page Calculateur) : la page donne sa hauteur pour que le cadre s'ajuste.
  if (window.parent !== window && window.ResizeObserver) {
    new ResizeObserver(() => window.parent.postMessage({ type: 'calculateur-hauteur', hauteur: document.documentElement.scrollHeight }, '*'))
      .observe(document.body);
  }
})();
</script>
</body>
</html>
